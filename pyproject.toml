[project]
name = "reqpilot"
version = "0.1.0"
description = "Prototyp: einheitliche Anforderungs-Tickets, Duplikatprüfung und Bug-Ursachenanalyse"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.45", "numpy>=1.26", "PyYAML>=6.0", "requests>=2.31", "pandas>=2.0", "google-auth>=2.30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "dev"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.coverage.run]
source = ["src/reqpilot"]
omit = ["src/reqpilot/ui/pages/*"]

[tool.ruff.lint.per-file-ignores]
# Registry als Tabelle lesbar halten
"dev/checks/__init__.py" = ["E501"]
