<script>
// Oberfläche der schlanken Fassung: zwei Seiten (Abgleich, Daten). Der Server liefert nur Daten (apiRequest in Api.gs),
// gezeichnet wird hier. Alles, was aus Jira, Confluence oder einer Eingabe stammt, läuft durch esc().
(function () {
  'use strict';

  var TEXT = {
    de: {
      skip: 'Zum Inhalt', nav: 'Bereiche', match: 'Abgleich', data: 'Daten', recent: 'Zuletzt geprüft',
      recent_empty: 'Deine letzten Anfragen stehen hier, nur in diesem Browser.', lang: 'Sprache', theme_dark: 'Dunkle Ansicht', theme_light: 'Helle Ansicht',
      h_match: 'Gibt es das schon?', lede: 'Beschreibe dein Anliegen in eigenen Worten. Es wird mit allen Jira-Tickets und Confluence-Seiten verglichen.',
      mode: 'Was möchtest du tun?', mode_check: 'Nur prüfen', mode_wish: 'Wunsch an International',
      mode_check_hint: 'Zeigt, ob es das Thema schon gibt.', mode_wish_hint: 'Zeigt zusätzlich, wohin der Wunsch gehört, und schreibt den Ticket-Text vor.',
      text_label: 'Dein Anliegen', placeholder: 'z. B. Der Bestellvorschlag soll Feiertage je Land berücksichtigen, damit vor Feiertagen nicht zu wenig bestellt wird.',
      sources: 'Quellen', country: 'Land', run: 'Abgleichen', running: 'Abgleich läuft', try: 'Zum Ausprobieren',
      step1: 'Suche nach Stichwörtern und nach Bedeutung …', step2: 'Reranker ordnet die besten Stellen …', step3: 'Ergebnis wird zusammengestellt …',
      hits: 'Treffer', hit_one: '1 Treffer', hit_n: '{n} Treffer', no_hits: 'Nichts Passendes gefunden',
      no_hits_hint: 'Zu diesem Anliegen gibt es weder ein Ticket noch eine Seite. Formuliere es ruhig mit den Fachbegriffen, die im Ticket stehen würden, und prüfe noch einmal.',
      duplicate: 'Duplikat', similar: 'Sehr ähnlich', related: 'Verwandt', similarity: 'Ähnlichkeit {n} %',
      by_keyword: 'Stichwörter', by_meaning: 'Bedeutung', more_spots: '+{n} weitere Stellen', open: 'Öffnen',
      v_duplicate: 'Das gibt es sehr wahrscheinlich schon', v_similar: 'Ähnliches ist schon da', v_new: 'Dazu gibt es noch nichts',
      v_duplicate_hint: 'Bitte zuerst dieses Ticket ansehen, statt ein neues zu schreiben:', v_similar_hint: 'Am nächsten liegt:',
      v_new_hint: 'Kein Ticket und keine Seite ist diesem Anliegen wirklich ähnlich.',
      counts: '{d} Duplikat, {s} sehr ähnlich, {r} verwandt', scale_new: 'neu', how: 'So wurde gesucht',
      how_both: 'Stichwörter und Bedeutung', how_lex: 'nur Stichwörter', how_vec: 'nur Bedeutung',
      rr_ranking: 'sortiert vom Reranker', rr_gemini: 'sortiert von Gemini', rr_none: 'ohne Reranker', spots: '{n} Stellen in {s} s',
      stream: 'Wohin gehört das?', stream_tickets: 'Abgeleitet aus den ähnlichsten Tickets.', stream_profile: 'Geschätzt aus den Stream-Beschreibungen, weil kein ähnliches Ticket einen Stream trägt.',
      stream_none: 'Aus den Daten lässt sich kein Stream ableiten.', like: 'wie', epic: 'Epic', votes_one: '1 Ticket', votes_n: '{n} Tickets',
      draft: 'Ticket-Text für Jira', draft_ai: 'Mit KI formuliert', draft_rule: 'Ohne KI formuliert', copy: 'Text kopieren', copied: 'Kopiert', questions: 'Das fehlt noch',
      guide: 'So schreiben ähnliche Tickets', guide_sections: 'Diese Abschnitte kommen dort vor', guide_none: 'ohne Überschriften', chars: '{n} Zeichen',
      h_data: 'Was in den Daten steckt', data_lede: 'Längen und Aufbau der Tickets und Seiten. Daraus ergibt sich, wie groß die Chunks für die Suche sein sollten.',
      recalc: 'Neu berechnen', store_bigquery: 'Auswertung über alle Daten in BigQuery', store_memory: 'Auswertung über die Daten im Speicher (ohne BigQuery)',
      advice: 'Empfohlene Chunk-Größe', advice_ok: 'Deine Einstellung passt zu den Daten.', advice_change: 'Aktuell eingestellt: {c} Zeichen, {o} Überlappung.',
      advice_how: 'Umstellen: in den Skripteigenschaften CHUNK_CHARS = {c} und CHUNK_OVERLAP = {o} setzen, dann im Editor abgleichVoll ausführen.',
      chars_unit: 'Zeichen', overlap: 'Überlappung', est: 'Erwartet rund {n} Chunks. Bis alles eingebettet ist, braucht der Abgleich etwa so viele Läufe: {r}.',
      jira: 'Jira-Tickets', confluence: 'Confluence-Seiten', entries: 'Einträge', chunks: 'Chunks', embedded: 'davon mit Vektor',
      length: 'Textlänge in Zeichen', median: 'Median', p90: '90 % bis', longest: 'längster', chunk_mark: 'Chunk {n}',
      strip_alt: 'Die Hälfte der Texte ist höchstens {m} Zeichen lang, 90 % höchstens {p}. Ein Chunk fasst {c} Zeichen.',
      empty: 'ohne Text', dup_titles: 'doppelte Titel', with_headings: 'mit Überschriften', sec_per: 'Überschriften je Eintrag (Median)',
      sec_len: 'Abschnittslänge (50 / 75 / 90 %)', one_chunk: 'passen in einen Chunk', sample: 'Stichprobe {n}',
      g_stream: 'Streams', g_status: 'Status', g_space: 'Confluence-Bereiche', sync: 'Letzter Abgleich', sync_none: 'Noch kein Abgleich gelaufen. Im Editor abgleichEinrichten ausführen.',
      no_data: 'Noch keine Daten', no_data_hint: 'Sobald der Abgleich gelaufen ist, steht hier die Auswertung.',
      failed: 'Das hat nicht geklappt', retry: 'Erneut versuchen', loading: 'Wird geladen …'
    },
    en: {
      skip: 'Skip to content', nav: 'Sections', match: 'Check', data: 'Data', recent: 'Recently checked',
      recent_empty: 'Your latest requests appear here, in this browser only.', lang: 'Language', theme_dark: 'Dark view', theme_light: 'Light view',
      h_match: 'Does this already exist?', lede: 'Describe your request in your own words. It is compared with every Jira ticket and Confluence page.',
      mode: 'What would you like to do?', mode_check: 'Check only', mode_wish: 'Request to International',
      mode_check_hint: 'Shows whether the topic already exists.', mode_wish_hint: 'Also shows where the request belongs and drafts the ticket text.',
      text_label: 'Your request', placeholder: 'e.g. The order proposal should consider public holidays per country so stores do not under-order before a holiday.',
      sources: 'Sources', country: 'Country', run: 'Check', running: 'Checking', try: 'Try an example',
      step1: 'Searching by keywords and by meaning …', step2: 'Reranker is ordering the best passages …', step3: 'Putting the result together …',
      hits: 'Matches', hit_one: '1 match', hit_n: '{n} matches', no_hits: 'Nothing suitable found',
      no_hits_hint: 'There is no ticket or page on this request. Try the technical terms a ticket would use and check again.',
      duplicate: 'Duplicate', similar: 'Very similar', related: 'Related', similarity: 'Similarity {n}%',
      by_keyword: 'Keywords', by_meaning: 'Meaning', more_spots: '+{n} more passages', open: 'Open',
      v_duplicate: 'This very likely exists already', v_similar: 'Something similar exists', v_new: 'Nothing on this yet',
      v_duplicate_hint: 'Please look at this ticket first instead of writing a new one:', v_similar_hint: 'The closest one is:',
      v_new_hint: 'No ticket and no page is really similar to this request.',
      counts: '{d} duplicate, {s} very similar, {r} related', scale_new: 'new', how: 'How it was searched',
      how_both: 'keywords and meaning', how_lex: 'keywords only', how_vec: 'meaning only',
      rr_ranking: 'ordered by the reranker', rr_gemini: 'ordered by Gemini', rr_none: 'no reranker', spots: '{n} passages in {s} s',
      stream: 'Where does it belong?', stream_tickets: 'Derived from the most similar tickets.', stream_profile: 'Estimated from the stream descriptions because no similar ticket carries a stream.',
      stream_none: 'The data does not suggest a stream.', like: 'like', epic: 'Epic', votes_one: '1 ticket', votes_n: '{n} tickets',
      draft: 'Ticket text for Jira', draft_ai: 'Written with AI', draft_rule: 'Written without AI', copy: 'Copy text', copied: 'Copied', questions: 'Still missing',
      guide: 'How similar tickets are written', guide_sections: 'Sections used there', guide_none: 'no headings', chars: '{n} characters',
      h_data: 'What is in the data', data_lede: 'Length and structure of tickets and pages. This tells how large the passages for search should be.',
      recalc: 'Recalculate', store_bigquery: 'Analysis of all data in BigQuery', store_memory: 'Analysis of the data in memory (no BigQuery)',
      advice: 'Recommended chunk size', advice_ok: 'Your setting fits the data.', advice_change: 'Current setting: {c} characters, {o} overlap.',
      advice_how: 'To change: set CHUNK_CHARS = {c} and CHUNK_OVERLAP = {o} in the script properties, then run abgleichVoll in the editor.',
      chars_unit: 'characters', overlap: 'overlap', est: 'About {n} chunks expected. Sync runs needed until everything is embedded: about {r}.',
      jira: 'Jira tickets', confluence: 'Confluence pages', entries: 'entries', chunks: 'chunks', embedded: 'with a vector',
      length: 'Text length in characters', median: 'Median', p90: '90% up to', longest: 'longest', chunk_mark: 'Chunk {n}',
      strip_alt: 'Half of the texts have at most {m} characters, 90% at most {p}. One chunk holds {c} characters.',
      empty: 'without text', dup_titles: 'duplicate titles', with_headings: 'with headings', sec_per: 'Headings per entry (median)',
      sec_len: 'Section length (50 / 75 / 90%)', one_chunk: 'fit into one chunk', sample: 'Sample of {n}',
      g_stream: 'Streams', g_status: 'Status', g_space: 'Confluence spaces', sync: 'Last sync', sync_none: 'No sync has run yet. Run abgleichEinrichten in the editor.',
      no_data: 'No data yet', no_data_hint: 'The analysis appears here once the sync has run.',
      failed: 'That did not work', retry: 'Try again', loading: 'Loading …'
    }
  };

  var store = {
    get: function (k, fallback) { try { var v = localStorage.getItem(k); return v === null ? fallback : v; } catch (e) { return fallback; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ohne Speicher */ } }
  };
  var S = { path: '/abgleich', ctx: null, lang: store.get('lang', 'de') === 'en' ? 'en' : 'de', busy: false, fatal: '', step: 0,
    form: { text: '', modus: 'pruefen', country: '', quellen: ['jira', 'confluence'] } };

  function t(key, vars) {
    var s = (TEXT[S.lang] && TEXT[S.lang][key]) || TEXT.de[key] || key;
    return vars ? s.replace(/\{(\w+)\}/g, function (m, k) { return vars[k] === undefined ? m : String(vars[k]); }) : s;
  }
  function esc(v) {
    return String(v === null || v === undefined ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function num(n) { return Number(n || 0).toLocaleString(S.lang === 'en' ? 'en-GB' : 'de-DE'); }
  function icon(name) { return '<svg class="ic" aria-hidden="true" focusable="false"><use href="#i-' + name + '"/></svg>'; }
  function safeUrl(u) { return /^https?:\/\//i.test(String(u || '')) ? String(u) : ''; }
  function link(url, label, cls) {
    var u = safeUrl(url);
    return u ? '<a class="' + (cls || '') + '" href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + label + '</a>' : '<span class="' + (cls || '') + '">' + label + '</span>';
  }

  function api(method, path, params) {
    return new Promise(function (resolve, reject) {
      if (!(window.google && google.script && google.script.run)) { reject(new Error('google.script.run fehlt')); return; }
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).apiRequest(method, path, params || {});
    }).then(function (text) {
      var d = JSON.parse(text);
      if (d.fatal) throw new Error(d.fatal);
      return d;
    });
  }

  // ---------- Zuletzt geprüft (nur in diesem Browser) ----------

  function recent() { try { var l = JSON.parse(store.get('recent', '[]')); return Array.isArray(l) ? l.slice(0, 8) : []; } catch (e) { return []; } }
  function remember(form, level) {
    var list = recent().filter(function (r) { return r.text !== form.text; });
    list.unshift({ text: form.text.slice(0, 600), modus: form.modus, level: level });
    store.set('recent', JSON.stringify(list.slice(0, 8)));
  }

  // ---------- Rahmen ----------

  function shell(main) {
    var nav = [['/abgleich', 'search', t('match')], ['/daten', 'data', t('data')]].map(function (n) {
      return '<a class="nav-link" href="#' + n[0] + '"' + (S.path === n[0] ? ' aria-current="page"' : '') + '>' + icon(n[1]) + '<span>' + n[2] + '</span></a>';
    }).join('');
    var list = recent();
    var rec = list.length ? '<ul class="recent-list">' + list.map(function (r, i) {
      return '<li><button type="button" class="recent-item" data-recent="' + i + '"><span class="dot lvl-' + esc(r.level || 'new') + '" aria-hidden="true"></span><span class="recent-text">' + esc(r.text) + '</span></button></li>';
    }).join('') + '</ul>' : '<p class="recent-empty">' + t('recent_empty') + '</p>';
    var dark = document.documentElement.dataset.theme === 'dark';
    return '<a class="skip" href="#main">' + t('skip') + '</a><div class="shell">' +
      '<aside class="rail"><div class="brand"><img src="' + MARK_SRC + '" alt="" width="30" height="30"><span>' + esc(window.APP_NAME || '') + '</span></div>' +
      '<nav class="nav" aria-label="' + t('nav') + '">' + nav + '</nav>' +
      '<section class="recent" aria-labelledby="h-recent"><h2 id="h-recent">' + t('recent') + '</h2>' + rec + '</section>' +
      '<div class="rail-foot"><div class="lang" role="group" aria-label="' + t('lang') + '">' +
      ['de', 'en'].map(function (l) { return '<button type="button" data-lang="' + l + '" aria-pressed="' + (S.lang === l) + '">' + l.toUpperCase() + '</button>'; }).join('') + '</div>' +
      '<button type="button" class="icon-btn" data-theme-toggle aria-label="' + t(dark ? 'theme_light' : 'theme_dark') + '" title="' + t(dark ? 'theme_light' : 'theme_dark') + '">' + icon(dark ? 'sun' : 'moon') + '</button></div></aside>' +
      '<main id="main" class="main" tabindex="-1">' + main + '</main></div>';
  }

  function banner(lines) {
    lines = (lines || []).filter(String);
    return lines.length ? '<div class="banner" role="status">' + icon('alert') + '<div>' + lines.map(function (l) { return '<p>' + esc(l) + '</p>'; }).join('') + '</div></div>' : '';
  }

  // ---------- Seite Abgleich ----------

  function composer(ctx) {
    var f = S.form, wish = f.modus === 'wunsch';
    var modes = [['pruefen', t('mode_check')], ['wunsch', t('mode_wish')]].map(function (m) {
      return '<label class="seg-item"><input type="radio" name="modus" value="' + m[0] + '"' + (f.modus === m[0] ? ' checked' : '') + '><span>' + m[1] + '</span></label>';
    }).join('');
    var src = [['jira', 'Jira', 'ticket'], ['confluence', 'Confluence', 'page']].map(function (s) {
      return '<label class="chip"><input type="checkbox" name="quelle" value="' + s[0] + '"' + (f.quellen.indexOf(s[0]) >= 0 ? ' checked' : '') + '>' + icon(s[2]) + '<span>' + s[1] + '</span></label>';
    }).join('');
    var countries = (ctx.countries || []).map(function (c) { return '<option' + (c === f.country ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('');
    return '<form class="composer" id="composer" novalidate>' +
      '<fieldset class="seg"><legend class="sr-only">' + t('mode') + '</legend>' + modes + '</fieldset>' +
      '<p class="mode-hint" id="mode-hint">' + t(wish ? 'mode_wish_hint' : 'mode_check_hint') + '</p>' +
      '<label class="sr-only" for="text">' + t('text_label') + '</label>' +
      '<textarea id="text" name="text" rows="' + (ctx.result ? 3 : 5) + '" maxlength="6000" placeholder="' + esc(t('placeholder')) + '" aria-describedby="mode-hint">' + esc(f.text) + '</textarea>' +
      '<div class="composer-row"><fieldset class="chips"><legend class="sr-only">' + t('sources') + '</legend>' + src + '</fieldset>' +
      (wish ? '<label class="country"><span>' + t('country') + '</span><select name="country">' + countries + '</select></label>' : '') +
      '<button type="submit" class="btn"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? '<span class="spinner" aria-hidden="true"></span>' + t('running') : icon('send') + t('run')) + '</button></div></form>';
  }

  function ring(score, level) {
    var c = 2 * Math.PI * 17, off = c * (1 - Math.max(0, Math.min(100, score)) / 100);
    return '<div class="ring lvl-' + level + '" role="img" aria-label="' + esc(t('similarity', { n: score })) + '"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="ring-track" cx="20" cy="20" r="17"/>' +
      '<circle class="ring-value" cx="20" cy="20" r="17" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/></svg><b>' + score + '</b></div>';
  }

  function hitItem(h, streams) {
    var tags = [];
    if (h.status) tags.push('<span class="tag">' + esc(h.status) + '</span>');
    if (h.stream) tags.push('<span class="tag tag-stream">' + esc(streams[h.stream] || h.stream) + '</span>');
    if (h.space) tags.push('<span class="tag">' + esc(h.space) + '</span>');
    var passages = h.passages.map(function (p) {
      return '<p class="passage">' + (p.heading ? '<span class="path">' + esc(p.heading) + '</span>' : '') + esc(p.text || h.title) + '</p>';
    }).join('');
    var via = (h.by_keyword ? '<span class="via">' + icon('word') + t('by_keyword') + '</span>' : '') + (h.by_meaning ? '<span class="via">' + icon('sense') + t('by_meaning') + '</span>' : '');
    return '<li class="hit lvl-' + h.level + '">' + ring(h.score, h.level) + '<div class="hit-body">' +
      '<div class="hit-meta"><span class="pill lvl-' + h.level + '">' + t(h.level) + '</span><span class="src">' + icon(h.source === 'jira' ? 'ticket' : 'page') +
      esc(h.source === 'jira' ? h.id : 'Confluence') + '</span>' + tags.join('') + '</div>' +
      '<h3>' + link(h.url, esc(h.title) + (safeUrl(h.url) ? icon('out') : ''), 'hit-title') + '</h3>' + passages +
      '<p class="hit-foot">' + via + (h.n_passages > h.passages.length ? '<span>' + t('more_spots', { n: h.n_passages - h.passages.length }) + '</span>' : '') + '</p></div></li>';
  }

  function verdictCard(r) {
    var v = r.verdict, s = r.search, top = r.hits.length ? r.hits.reduce(function (a, h) { return Math.max(a, h.score); }, 0) : 0;
    var scale = '';
    if (s.scale) {
      scale = '<div class="meter" aria-hidden="true"><div class="meter-track"><span class="meter-zone z-similar" style="left:' + s.scale.similar + '%;width:' + (s.scale.duplicate - s.scale.similar) + '%"></span>' +
        '<span class="meter-zone z-duplicate" style="left:' + s.scale.duplicate + '%;width:' + (100 - s.scale.duplicate) + '%"></span>' +
        '<span class="meter-pin lvl-' + v.level + '" style="left:' + top + '%"></span></div>' +
        '<div class="meter-labels"><span>' + t('scale_new') + '</span><span style="left:' + s.scale.similar + '%">' + t('similar') + '</span><span style="left:' + s.scale.duplicate + '%">' + t('duplicate') + '</span></div></div>';
    }
    var how = t(s.lexical && s.vector ? 'how_both' : s.vector ? 'how_vec' : 'how_lex') + ', ' + t('rr_' + s.reranker) + '. ' + t('spots', { n: s.passages, s: (s.ms / 1000).toFixed(1).replace('.', S.lang === 'en' ? '.' : ',') });
    return '<section class="card verdict lvl-' + v.level + '" aria-labelledby="h-verdict"><h2 id="h-verdict" tabindex="-1">' + t('v_' + v.level) + '</h2>' +
      '<p class="verdict-hint">' + t('v_' + v.level + '_hint') + '</p>' +
      (v.top ? '<p class="verdict-top">' + link(v.top.url, esc((v.top.source === 'jira' ? v.top.id + ' ' : '') + v.top.title), 'verdict-link') + '</p>' : '') + scale +
      (r.hits.length ? '<p class="fine">' + t('counts', { d: v.duplicates, s: v.similar, r: v.related }) + '</p>' : '') +
      '<p class="fine"><span class="fine-label">' + t('how') + ':</span> ' + how + '</p></section>';
  }

  function streamCard(r) {
    if (r.modus !== 'wunsch' && !r.streams.length) return '';
    var rows = r.streams.map(function (s, i) {
      return '<li class="bar-row' + (i === 0 ? ' is-top' : '') + '"><div class="bar-head"><span class="bar-name">' + esc(s.name) + '</span><span class="bar-val">' + s.share + ' %</span></div>' +
        '<div class="bar"><span style="width:' + Math.max(3, s.share) + '%"></span></div>' +
        (s.examples && s.examples.length ? '<p class="fine">' + t('like') + ' ' + s.examples.map(esc).join(', ') + '</p>' : '') + '</li>';
    }).join('');
    var epics = r.epics.length ? '<p class="epics"><span class="fine-label">' + t('epic') + ':</span> ' + r.epics.slice(0, 3).map(function (e) {
      return '<span class="tag">' + esc(e.id) + ' <b>' + e.share + ' %</b></span>';
    }).join(' ') + '</p>' : '';
    return '<section class="card" aria-labelledby="h-stream"><h2 id="h-stream">' + t('stream') + '</h2><p class="fine">' + t('stream_' + r.stream_basis) + '</p>' +
      (rows ? '<ul class="bars">' + rows + '</ul>' : '') + epics + '</section>';
  }

  function draftCard(r) {
    if (!r.draft) return '';
    var d = r.draft, g = r.guide || { examples: [], sections: [] };
    var q = d.open_questions && d.open_questions.length ? '<h3>' + t('questions') + '</h3><ul class="plain">' + d.open_questions.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '';
    var guide = '';
    if (g.examples.length) {
      guide = '<section class="card" aria-labelledby="h-guide"><h2 id="h-guide">' + t('guide') + '</h2><ul class="guide">' + g.examples.map(function (e) {
        return '<li>' + link(e.url, esc(e.id + ' ' + e.title), 'guide-link') + '<p class="fine">' + (e.sections.length ? e.sections.map(esc).join(', ') : t('guide_none')) + '. ' + t('chars', { n: num(e.chars) }) + '</p></li>';
      }).join('') + '</ul>' + (g.sections.length ? '<p class="fine"><span class="fine-label">' + t('guide_sections') + ':</span> ' + g.sections.map(function (s) { return esc(s.name); }).join(', ') + '</p>' : '') + '</section>';
    }
    return '<section class="card draft" aria-labelledby="h-draft"><div class="card-head"><h2 id="h-draft">' + t('draft') + '</h2>' +
      '<button type="button" class="btn btn-quiet" data-copy>' + icon('copy') + '<span>' + t('copy') + '</span></button></div>' +
      '<p class="fine">' + t(d.source === 'gemini' ? 'draft_ai' : 'draft_rule') + (d.notice ? '. ' + esc(d.notice) : '') + '</p>' +
      '<pre class="markup" id="markup" tabindex="0">' + esc(d.markup) + '</pre>' + q + '</section>' + guide;
  }

  function results(ctx) {
    if (S.busy) {
      return '<div class="waiting" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span><span id="step">' + t('step' + (S.step + 1)) + '</span></div>' +
        '<div class="skel-list" aria-hidden="true"><span></span><span></span><span></span></div>';
    }
    if (ctx.error) return '<div class="banner is-error" role="alert">' + icon('alert') + '<div><p><b>' + t('failed') + '</b></p><p>' + esc(ctx.error) + '</p></div></div>';
    var r = ctx.result;
    if (!r) return '';
    var names = ctx.stream_names || {};
    var list = r.hits.length ? '<ol class="hit-list">' + r.hits.map(function (h) { return hitItem(h, names); }).join('') + '</ol>'
      : '<div class="empty"><p class="empty-title">' + t('no_hits') + '</p><p>' + t('no_hits_hint') + '</p></div>';
    return banner((ctx.notices || []).concat(r.search.note ? [r.search.note] : [])) +
      '<div class="grid"><section class="hits" aria-labelledby="h-hits"><h2 id="h-hits">' + (r.hits.length === 1 ? t('hit_one') : t('hit_n', { n: r.hits.length })) + '</h2>' + list + '</section>' +
      '<div class="side">' + verdictCard(r) + streamCard(r) + draftCard(r) + '</div></div>';
  }

  function matchPage(ctx) {
    var has = !!(ctx.result || ctx.error || S.busy);
    var ex = (ctx.examples || []).map(function (e, i) { return '<button type="button" class="chip-btn" data-example="' + i + '">' + esc(e.label) + '</button>'; }).join('');
    return '<div class="page' + (has ? ' has-result' : ' is-start') + '"><header class="page-head"><h1>' + t('h_match') + '</h1><p class="lede">' + t('lede') + '</p></header>' +
      composer(ctx) + (has ? '' : '<div class="examples"><span>' + t('try') + '</span>' + ex + '</div>') +
      '<div id="result">' + results(ctx) + '</div></div>';
  }

  // ---------- Seite Daten ----------

  function strip(s, cfg) {
    var max = Math.max(s.len.p99, cfg.chars * 1.25, 1), pct = function (v) { return Math.min(100, 100 * v / max).toFixed(2); };
    return '<div class="strip" role="img" aria-label="' + esc(t('strip_alt', { m: num(s.len.p50), p: num(s.len.p90), c: num(cfg.chars) })) + '">' +
      '<div class="strip-track"><span class="strip-band" style="left:' + pct(s.len.p10) + '%;width:' + (pct(s.len.p90) - pct(s.len.p10)).toFixed(2) + '%"></span>' +
      '<span class="strip-box" style="left:' + pct(s.len.p25) + '%;width:' + Math.max(0.6, pct(s.len.p75) - pct(s.len.p25)).toFixed(2) + '%"></span>' +
      '<span class="strip-median" style="left:' + pct(s.len.p50) + '%"></span><span class="strip-chunk" style="left:' + pct(cfg.chars) + '%"><i>' + t('chunk_mark', { n: num(cfg.chars) }) + '</i></span></div>' +
      '<div class="strip-axis"><span>0</span><span>' + num(Math.round(max)) + '</span></div></div>';
  }

  function sourceCard(s, rep) {
    var state = (rep.chunks || []).filter(function (c) { return c.source === s.source; })[0] || { chunks: 0, embedded: 0 };
    var st = s.structure || { sample: 0, with_headings: 0, sections_per_doc: 0, section_len: { p50: 0, p75: 0, p90: 0 } };
    var row = function (k, v) { return '<div class="kv"><dt>' + k + '</dt><dd>' + v + '</dd></div>'; };
    return '<section class="card source" aria-labelledby="h-' + s.source + '"><div class="card-head"><h2 id="h-' + s.source + '">' + icon(s.source === 'jira' ? 'ticket' : 'page') + t(s.source) + '</h2>' +
      '<span class="fine">' + t('sample', { n: num(st.sample) }) + '</span></div>' +
      '<div class="tiles"><div class="tile"><b>' + num(s.docs) + '</b><span>' + t('entries') + '</span></div><div class="tile"><b>' + num(state.chunks) + '</b><span>' + t('chunks') + '</span></div>' +
      '<div class="tile"><b>' + num(state.embedded) + '</b><span>' + t('embedded') + '</span></div></div>' +
      '<h3>' + t('length') + '</h3>' + strip(s, rep.advice) +
      '<dl class="kvs">' + row(t('median'), num(s.len.p50)) + row(t('p90'), num(s.len.p90)) + row(t('longest'), num(s.len.max)) +
      row(t('one_chunk'), (s.single_chunk === undefined ? 100 : s.single_chunk) + ' %') + row(t('with_headings'), st.with_headings + ' %') + row(t('sec_per'), num(st.sections_per_doc)) +
      row(t('sec_len'), num(st.section_len.p50) + ' / ' + num(st.section_len.p75) + ' / ' + num(st.section_len.p90)) +
      row(t('empty'), num(s.empty)) + row(t('dup_titles'), num(s.dup_titles)) + '</dl></section>';
  }

  function groupCard(title, rows) {
    if (!rows || !rows.length) return '';
    var max = rows.reduce(function (a, r) { return Math.max(a, r.n); }, 1);
    return '<section class="card"><h2>' + title + '</h2><ul class="bars compact">' + rows.map(function (r) {
      return '<li class="bar-row"><div class="bar-head"><span class="bar-name">' + esc(r.name) + '</span><span class="bar-val">' + num(r.n) + '</span></div><div class="bar"><span style="width:' + Math.max(2, 100 * r.n / max).toFixed(1) + '%"></span></div></li>';
    }).join('') + '</ul></section>';
  }

  function dataPage(ctx) {
    var rep = ctx.report;
    var head = '<header class="page-head row"><div><h1>' + t('h_data') + '</h1><p class="lede">' + t('data_lede') + '</p></div>' +
      '<button type="button" class="btn btn-quiet" data-recalc' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? '<span class="spinner" aria-hidden="true"></span>' : icon('refresh')) + '<span>' + t('recalc') + '</span></button></header>';
    var err = ctx.error ? '<div class="banner is-error" role="alert">' + icon('alert') + '<div><p><b>' + t('failed') + '</b></p><p>' + esc(ctx.error) + '</p></div></div>' : '';
    if (!rep || !rep.sources.some(function (s) { return s.docs > 0; })) {
      return '<div class="page">' + head + err + banner(ctx.notices) + '<div class="empty"><p class="empty-title">' + t('no_data') + '</p><p>' + t(ctx.store === 'bigquery' ? 'sync_none' : 'no_data_hint') + '</p></div></div>';
    }
    var a = rep.advice;
    var advice = '<section class="card advice" aria-labelledby="h-advice"><h2 id="h-advice">' + t('advice') + '</h2>' +
      '<p class="advice-value"><b>' + num(a.chars) + '</b> ' + t('chars_unit') + '<span class="advice-plus">' + num(a.overlap) + ' ' + t('overlap') + '</span></p>' +
      '<p class="advice-state">' + (a.differs ? t('advice_change', { c: num(rep.config.chars), o: num(rep.config.overlap) }) : icon('check') + t('advice_ok')) + '</p>' +
      (a.differs ? '<p class="fine">' + t('advice_how', { c: a.chars, o: a.overlap }) + '</p>' : '') +
      '<ul class="plain">' + a.lines.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul>' +
      '<p class="fine">' + t('est', { n: num(a.est_chunks), r: num(a.est_runs) }) + '</p></section>';
    var sync = ctx.store === 'bigquery' ? '<section class="card"><h2>' + t('sync') + '</h2>' + (ctx.sync && ctx.sync.length ? '<ul class="sync">' + ctx.sync.map(function (x) {
      return '<li><span class="dot ' + (x.ok ? 'ok' : 'bad') + '" aria-hidden="true"></span><div><b>' + esc(x.source === 'jira' ? 'Jira' : 'Confluence') + '</b> <span class="fine">' + esc(x.at) + '</span><p class="fine">' + esc(x.note) + '</p></div></li>';
    }).join('') + '</ul>' : '<p class="fine">' + t('sync_none') + '</p>') + '</section>' : '';
    return '<div class="page">' + head + err + banner(ctx.notices) + '<p class="fine store">' + t('store_' + rep.mode) + '</p>' +
      '<div class="data-grid"><div class="data-main">' + advice + rep.sources.filter(function (s) { return s.docs > 0; }).map(function (s) { return sourceCard(s, rep); }).join('') + '</div>' +
      '<div class="side">' + sync + groupCard(t('g_stream'), rep.groups.stream) + groupCard(t('g_status'), rep.groups.status) + groupCard(t('g_space'), rep.groups.space) + '</div></div></div>';
  }

  // ---------- Zeichnen und Bedienen ----------

  var app = document.getElementById('app');

  function draw(keepFocus) {
    var active = keepFocus && document.activeElement && document.activeElement.id;
    var main;
    if (S.fatal) main = '<div class="page"><h1>' + t('failed') + '</h1><div class="banner is-error" role="alert">' + icon('alert') + '<div><p>' + esc(S.fatal) + '</p></div></div><p><button type="button" class="btn" data-retry>' + t('retry') + '</button></p></div>';
    else if (!S.ctx) main = '<div class="page"><h1 class="sr-only">' + esc(window.APP_NAME || '') + '</h1><div class="waiting" role="status"><span class="spinner" aria-hidden="true"></span>' + t('loading') + '</div></div>';
    else main = S.path === '/daten' ? dataPage(S.ctx) : matchPage(S.ctx);
    app.innerHTML = shell(main);
    document.documentElement.lang = S.lang;
    document.title = (S.path === '/daten' ? t('data') : t('match')) + ' · ' + (window.APP_NAME || '');
    if (active) { var el = document.getElementById(active); if (el) { el.focus(); if (el.setSelectionRange) el.setSelectionRange(el.value.length, el.value.length); } }
  }

  function readForm() {
    var f = document.getElementById('composer');
    if (!f) return;
    var data = new FormData(f);
    S.form.text = String(data.get('text') || '');
    S.form.modus = data.get('modus') === 'wunsch' ? 'wunsch' : 'pruefen';
    S.form.quellen = data.getAll('quelle').map(String);
    if (data.get('country')) S.form.country = String(data.get('country'));
  }

  function load(path, params) {
    S.path = path === '/daten' ? '/daten' : '/abgleich';
    S.fatal = '';
    var first = window.BOOT && window.BOOT.path === S.path && !params ? window.BOOT.promise.then(function (text) { var d = JSON.parse(text); if (d.fatal) throw new Error(d.fatal); return d; }) : api('GET', S.path, params);
    window.BOOT = null;
    if (!S.ctx || S.ctx.active !== (S.path === '/daten' ? 'daten' : 'abgleich')) { S.ctx = null; draw(); }
    return first.then(function (d) {
      S.ctx = d.ctx; S.busy = false;
      if (S.path === '/abgleich' && !S.form.country) S.form.country = d.ctx.form.country;
      draw();
    }).catch(function (e) { S.busy = false; S.fatal = e && e.message ? e.message : String(e); draw(); });
  }

  var stepTimer = null;
  function run() {
    if (S.busy) return;
    readForm();
    if (!S.form.quellen.length) S.form.quellen = ['jira', 'confluence'];
    S.busy = true; S.step = 0;
    if (S.ctx) { S.ctx.result = null; S.ctx.error = null; }
    draw();
    stepTimer = setInterval(function () {
      S.step = Math.min(2, S.step + 1);
      var el = document.getElementById('step');
      if (el) el.textContent = t('step' + (S.step + 1));
    }, 1800);
    api('POST', '/abgleich', { text: [S.form.text], modus: [S.form.modus], country: [S.form.country], quelle: S.form.quellen }).then(function (d) {
      S.ctx = d.ctx;
      if (d.ctx.result) remember(S.form, d.ctx.result.verdict.level);
    }).catch(function (e) {
      if (S.ctx) S.ctx.error = e && e.message ? e.message : String(e); else S.fatal = String(e && e.message || e);
    }).then(function () {
      clearInterval(stepTimer);
      S.busy = false;
      draw();
      var h = document.getElementById('h-verdict') || document.querySelector('#result [role=alert]');
      if (h) { if (!h.hasAttribute('tabindex')) h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: false }); }
    });
  }

  function copyText(text, btn) {
    var done = function () {
      var label = btn.querySelector('span');
      if (label) { label.textContent = t('copied'); setTimeout(function () { if (label.isConnected) label.textContent = t('copy'); }, 1800); }
    };
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { /* dann von Hand markieren */ }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  }

  app.addEventListener('submit', function (e) { if (e.target.id === 'composer') { e.preventDefault(); run(); } });
  app.addEventListener('keydown', function (e) {
    if (e.target.id === 'text' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); }
  });
  app.addEventListener('change', function (e) {
    if (e.target.name === 'modus') { readForm(); draw(); var r = document.querySelector('input[name=modus]:checked'); if (r) r.focus(); }
  });
  app.addEventListener('click', function (e) {
    var el = e.target.closest('button, a');
    if (!el) return;
    if (el.hasAttribute('data-lang')) { readForm(); S.lang = el.getAttribute('data-lang') === 'en' ? 'en' : 'de'; store.set('lang', S.lang); draw(); return; }
    if (el.hasAttribute('data-theme-toggle')) {
      readForm();
      var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next; store.set('theme', next); draw();
      var b = document.querySelector('[data-theme-toggle]'); if (b) b.focus();
      return;
    }
    if (el.hasAttribute('data-example') && S.ctx) { var ex = S.ctx.examples[+el.getAttribute('data-example')]; if (ex) { S.form.text = ex.text; draw(); run(); } return; }
    if (el.hasAttribute('data-recent')) {
      var r = recent()[+el.getAttribute('data-recent')];
      if (!r) return;
      S.form.text = r.text; S.form.modus = r.modus === 'wunsch' ? 'wunsch' : 'pruefen';
      if (S.path !== '/abgleich') { location.hash = '#/abgleich'; }
      else { draw(); run(); }
      return;
    }
    if (el.hasAttribute('data-copy')) { var m = document.getElementById('markup'); if (m) copyText(m.textContent, el); return; }
    if (el.hasAttribute('data-recalc')) { S.busy = true; draw(); load('/daten', { neu: ['1'] }); return; }
    if (el.hasAttribute('data-retry')) { load(S.path); }
  });
  window.addEventListener('hashchange', function () {
    var p = location.hash.replace(/^#/, '');
    readForm();
    load(p === '/daten' ? '/daten' : '/abgleich');
  });

  load(window.BOOT ? window.BOOT.path : (location.hash.replace(/^#/, '') === '/daten' ? '/daten' : '/abgleich'));
})();
</script>
