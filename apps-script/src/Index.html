</script>
<script>
  // Erste Anfrage sofort starten, noch bevor das Skript unten gelesen ist. JsApp nimmt das Ergebnis aus BOOT.
  (function () {
    var path = window.START_PATH && window.START_PATH.charAt(0) === '/' ? window.START_PATH : '';
    if (!path) { try { path = decodeURI(location.hash.replace(/^#/, '')); } catch (err) { path = ''; } }
    if (path !== '/daten') path = '/abgleich';
    if (!(window.google && google.script && google.script.run)) return;
    window.BOOT = { path: path, promise: new Promise(function (resolve, reject) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).apiRequest('GET', path, {});
    }) };
    window.BOOT.promise.catch(function () { /* Fehler zeigt JsApp, sobald es die Antwort abholt */ });
  })();
</script>
<?!= include('JsApp') ?>
</body>
</html>
