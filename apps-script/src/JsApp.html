  var P = Promise.resolve();

  var store = {

  function t(key, vars) {
    var s = (TEXT[S.lang] && TEXT[S.lang][key]) || TEXT.de[key] || key;
    return vars ? s.replace(/\{(\w+)\}/g, function (m, k) { return vars[k] === undefined ? m : String(vars[k]); }) : s;

  function esc(v) {
    return String(v === null || v === undefined ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  function plural(key, n) {
    var forms = (TEXT[S.lang] && TEXT[S.lang][key]) || TEXT.de[key];
    return forms[n === 1 ? 0 : 1].replace('{n}', num(n));
  }
  function took(ms) {
    ms = Math.max(0, +ms || 0);
    return ms < 1000 ? num(Math.round(ms)) + ' ms' : (ms / 1000).toLocaleString(S.lang === 'en' ? 'en-GB' : 'de-DE', { maximumFractionDigits: 1 }) + ' s';
  }
  function calm(v) { v = String(v || ''); return v && v === v.toUpperCase() ? v.charAt(0) + v.slice(1).toLowerCase() : v; }
  function num(n) { return Number(n || 0).toLocaleString(S.lang === 'en' ? 'en-GB' : 'de-DE'); }

  function srcName(s) { return s === 'confluence' ? t('confluence') : t('jira'); }

  function api(method, path, params) {
    return new Promise(function (resolve, reject) {
      if (!(window.google && google.script && google.script.run)) { reject(new Error('google.script.run fehlt')); return; }
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).apiRequest(method, path, params || {});
    }).then(function (text) {
      var d = JSON.parse(text);
      if (d.fatal) throw new Error(d.fatal);
      return d;
    });
  }

  // ---------- Verlauf (nur in diesem Browser) ----------

  function history() { try { var l = JSON.parse(store.get('verlauf', '[]')); return Array.isArray(l) ? l.slice(0, 30) : []; } catch (e) { return []; } }
  function remember(form, level, result) {
    var list = history().filter(function (r) { return r.text !== form.text || r.modus !== form.modus; });
    list.unshift({ text: form.text.slice(0, 600), modus: form.modus, country: form.country, quellen: form.quellen, level: level, at: Date.now(), result: result || null });
    list = list.slice(0, 30);
    // Ergebnisse nur bei den neuesten 12 aufheben; reicht der Platz nicht, ohne Ergebnisse speichern
    list.forEach(function (r, i) { if (i >= 12) r.result = null; });
    try { localStorage.setItem('verlauf', JSON.stringify(list)); }
    catch (e) { list.forEach(function (r) { r.result = null; }); store.set('verlauf', JSON.stringify(list)); }
  }

  // ---------- Seitenleiste ----------

  function histHtml() {
    var list = history();
    if (!list.length) return '<p class="hist-empty">' + t('history_empty') + '</p>';
    var day = new Date(); day.setHours(0, 0, 0, 0);
    var group = '';
    return '<ul class="hist-list">' + list.map(function (r, i) {
      var g = r.at && r.at >= day.getTime() ? 'today' : 'earlier', head = g !== group ? '<li class="hist-group">' + t(g) + '</li>' : '';
      group = g;
      return head + '<li><button type="button" class="hist-item" data-hist="' + i + '" title="' + esc(r.text) + '"><span class="dot lvl-' + esc(r.level || 'new') + '" aria-hidden="true"></span><span><span class="sr-only">' + t(r.level === 'duplicate' || r.level === 'similar' ? r.level : 'fresh_lvl') + ': </span>' + esc(r.text) + '</span></button></li>';
    }).join('') + '</ul>';
  }

  function sideHtml() {
    var dark = document.documentElement.dataset.theme === 'dark', open = S.side === 'open';

      '<button type="button" class="icon-btn" data-theme-toggle id="theme" aria-label="' + t(dark ? 'theme_light' : 'theme_dark') + '">' + icon(dark ? 'sun' : 'moon') + '</button></div>';

  // ---------- Eingabe ----------

  function composerHtml(empty) {
    var f = S.form, wish = f.modus === 'wunsch';
    var countries = (S.ctx && S.ctx.countries) || [];
    var tog = function (v) {
      return '<label class="tog"><input type="checkbox" name="quelle" value="' + v + '"' + (f.quellen.indexOf(v) >= 0 ? ' checked' : '') + '><svg class="ic chk" aria-hidden="true" focusable="false"><use href="#i-check"/></svg><svg class="ic src" aria-hidden="true" focusable="false"><use href="#i-' + v + '"/></svg><span>' + srcName(v) + '</span></label>';
    };
    var radio = function (v, label) { return '<label><input type="radio" name="modus" value="' + v + '"' + (f.modus === v ? ' checked' : '') + '><span>' + label + '</span></label>'; };
    return '<form class="composer" id="composer" novalidate><label class="sr-only" for="text">' + t('text_label') + '</label>' +

  // ---------- Antwort ----------

  function lvlChip(level) {
    var key = level === 'duplicate' || level === 'similar' || level === 'related' ? level : 'new';
    return '<span class="lvl-chip lvl-' + key + '"><span class="dot" aria-hidden="true"></span>' + t(key === 'new' ? 'fresh_lvl' : key) + '</span>';

  function cite(turn, i) {
    return '<button type="button" class="cite" data-nowords data-turn="' + turn.id + '" data-hit="' + i + '" aria-label="' + esc(t('details', { id: turn.result.hits[i].id })) + '">' + (i + 1) + '</button>';
  }

  function proseHtml(turn) {
    var r = turn.result, v = r.verdict, hits = r.hits || [];
    var level = v.level === 'duplicate' || v.level === 'similar' ? v.level : 'new';
    var topIdx = 0;
    hits.forEach(function (h, i) { if (v.top && h.id === v.top.id) topIdx = i; });
    var top = hits[topIdx];
    var vars = top ? { c: cite(turn, topIdx), id: esc(top.id), title: esc(top.title), n: num(top.score) } : null;
    var p = level === 'new' ? t('p_new') + (top ? ' ' + t('p_new_rel', vars) : '') : (top ? t('p_' + level, vars) : '');
    var parts = [['n_dup', v.duplicates], ['n_sim', v.similar], ['n_rel', v.related]].filter(function (x) { return x[1] > 0; }).map(function (x) { return plural(x[0], x[1]); });
    if (parts.length > 1) p += ' ' + t('p_counts', { list: parts.slice(0, -1).join(', ') + ' ' + t('and') + ' ' + parts[parts.length - 1] });
    var out = '<p class="prose">' + p + '</p>';
    if (r.modus === 'wunsch' && r.streams && r.streams.length) {
      out += '<p class="prose">' + t('p_stream', { name: esc(r.streams[0].name), n: num(r.streams[0].share) }) +

    }
    var url = top && level !== 'new' ? safeUrl(top.url) : '';
    var next = url ? '<a class="btn btn-primary" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + icon('out') + '<span>' + esc(t('open_in', { s: srcName(top.source) }) + ': ' + top.id) + '</span></a>' : '';

    return '<div class="verdict">' + lvlChip(level) + '<h2 id="h-verdict-' + turn.id + '" tabindex="-1">' + t('v_' + level) + '</h2>' + out + (next ? '<div class="next">' + next + '</div>' : '') + '</div>';
  }

  function hitHtml(turn, h, i) {
    var open = S.insp && S.insp.turn === turn.id && S.insp.kind === 'hit' && S.insp.i === i;
    var bits = [h.id, h.source === 'jira' ? (h.stream && S.ctx && S.ctx.stream_names && S.ctx.stream_names[h.stream]) || h.stream : h.space, calm(h.status)]
      .filter(Boolean).map(function (b, k) { return '<span' + (k === 0 ? ' class="mono"' : '') + '>' + esc(b) + '</span>'; }).join('<span aria-hidden="true">·</span>');
    var text = h.passages && h.passages[0] ? h.passages[0].text : '';
    var url = safeUrl(h.url);
    return '<li class="hit' + (open ? ' is-open' : '') + '" data-flip="hit-' + turn.id + '-' + i + '" data-flip-text data-hit-row="' + turn.id + '-' + i + '">' +
      '<button type="button" class="hit-main" data-turn="' + turn.id + '" data-hit="' + i + '" aria-expanded="' + !!open + '"><span class="hit-no" aria-hidden="true">' + (i + 1) + '</span>' +
      '<span class="hit-top">' + icon(h.source === 'confluence' ? 'confluence' : 'jira') + bits + '</span>' +
      '<span class="hit-title">' + esc(h.title) + '</span><span class="hit-text">' + esc(text) + '</span>' +
      '<span class="hit-score">' + lvlChip(h.level) + '<b class="num">' + num(h.score) + ' % ' + t('match_word') + '</b></span></button>' +
      (url ? '<a class="hit-out" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer" aria-label="' + esc(t('open_in', { s: srcName(h.source) }) + ': ' + h.id) + '">' + icon('out') + '</a>' : '') + '</li>';
  }

  function hitsHtml(turn) {
    var hits = turn.result.hits || [];
    if (!hits.length) return '<div class="empty"><b>' + t('no_hits') + '</b>' + t('no_hits_hint') + '</div>';
    var shown = turn.all ? hits : hits.slice(0, SHOWN);
    return '<ol class="hits">' + shown.map(function (h, i) { return hitHtml(turn, h, i); }).join('') + '</ol>' +
      (hits.length > SHOWN ? '<button type="button" class="more-btn" data-more="' + turn.id + '" aria-expanded="' + !!turn.all + '">' + icon('chevron') + '<span>' + t(turn.all ? 'show_less' : 'show_all', { n: hits.length }) + '</span></button>' : '');
  }

  function barRows(rows) {
    return '<ul class="bars">' + rows.map(function (s) {
      return '<li class="bar-row"><span class="bar-name">' + esc(s.name || s.id) + (s.examples && s.examples.length ? '<small>' + esc(t('like', { ids: s.examples.join(', ') })) + '</small>' : '') + '</span>' +
        '<span class="bar-val num">' + num(s.share) + ' %</span><div class="bar"><span style="--v:' + Math.max(0, Math.min(100, +s.share || 0)) + '"></span></div></li>';
    }).join('') + '</ul>';
  }

  function wishHtml(turn) {
    var r = turn.result, d = r.draft, g = r.guide, out = '';
    var open = S.insp && S.insp.turn === turn.id && S.insp.kind === 'draft';
    var streams = r.streams && r.streams.length ? barRows(r.streams.slice(0, 4)) : '<p class="fine">' + t('stream_none') + '</p>';
    var epics = r.epics && r.epics.length ? '<section class="sec"><div class="sec-head"><h3>' + icon('layers') + t('epic') + '</h3></div>' + barRows(r.epics.slice(0, 3)) + '</section>' : '';
    out += '<div class="two"><section class="sec"><div class="sec-head"><h3>' + icon('route') + t('stream') + '</h3>' +
      (r.stream_basis && r.stream_basis !== 'none' ? '<span class="fine">' + t(r.stream_basis === 'tickets' ? 'stream_tickets' : 'stream_profile') + '</span>' : '') + '</div>' + streams + '</section>' + epics + '</div>';
    if (d) {
      out += '<section class="sec"><div class="sec-head"><h3>' + icon('draft') + t('draft') + '</h3></div>' +
        (d.notice ? '<div class="note">' + icon('alert') + '<p>' + esc(d.notice) + '</p></div>' : '') +
        '<div class="artifact' + (open ? ' is-open' : '') + '" data-draft-row="' + turn.id + '"><button type="button" class="artifact-main" data-turn="' + turn.id + '" data-draft aria-expanded="' + !!open + '" aria-label="' + esc(t('draft_open') + ': ' + d.title) + '">' +
        '<span class="artifact-ic">' + icon('draft') + '</span><span class="artifact-txt"><b>' + esc(d.title) + '</b><span>' + t(d.source === 'gemini' ? 'draft_ai' : 'draft_rule') + ' · ' + t('chars', { n: num((d.markup || '').length) }) + '</span></span></button>' +
        '<button type="button" class="btn" data-copy="' + turn.id + '">' + icon('copy') + '<span>' + t('copy') + '</span></button></div>' +
        (d.open_questions && d.open_questions.length ? '<h3>' + t('questions') + '</h3><ul class="todo">' + d.open_questions.map(function (q) { return '<li>' + esc(q) + '</li>'; }).join('') + '</ul>' : '') + '</section>';
    }
    if (g && g.examples && g.examples.length) {
      out += '<section class="sec"><div class="sec-head"><h3>' + icon('book') + t('guide') + '</h3></div>' +
        (g.sections && g.sections.length ? '<div class="chips" aria-label="' + t('guide_sections') + '">' + g.sections.map(function (s) { return '<span class="tag">' + esc(s.name || s) + '</span>'; }).join('') + '</div>' : '') +
        '<ul class="guide">' + g.examples.map(function (e) {
          var u = safeUrl(e.url);
          return '<li>' + (u ? '<a class="mono" href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(e.id) + '</a>' : '<span class="mono">' + esc(e.id) + '</span>') +
            '<span>' + esc(e.title) + '</span><span class="fine num">' + t('chars', { n: num(e.chars) }) + '</span></li>';
        }).join('') + '</ul></section>';
    }
    return out;
  }

  function answerHtml(turn) {
    if (turn.state === 'run') {
      return '<div class="think" role="status"><span class="orb" aria-hidden="true"></span><span id="step-' + turn.id + '"><span>' + t('step' + ((turn.step || 0) + 1)) + '</span></span></div>' +
        '<div class="skel" aria-hidden="true"><i></i><i></i><i></i></div>';
    }
    if (!turn.result) {
      return '<div class="note is-error" role="alert">' + icon('alert') + '<div><p><b>' + t('failed') + '</b></p><p>' + esc(turn.error || '') + '</p></div></div>' +
        '<div><button type="button" class="btn" data-again="' + turn.id + '">' + icon('refresh') + '<span>' + t('retry') + '</span></button></div>';
    }
    var r = turn.result, s = r.search || {};
    var how = s.lexical && s.vector ? 'how_both' : s.vector ? 'how_vec' : 'how_lex';
    var meta = '<div class="meta-line"><span class="tag">' + t(how) + '</span><span class="tag">' + t(s.reranker === 'ranking' ? 'rr_ranking' : s.reranker === 'gemini' ? 'rr_gemini' : 'rr_none') + '</span>' +
      '<span class="tag num">' + t('spots', { n: num(s.passages), s: took(s.ms) }) + '</span></div>';
    var notes = [turn.error, s.note].filter(Boolean).map(function (n) { return '<div class="note" role="status">' + icon('alert') + '<p>' + esc(n) + '</p></div>'; }).join('');
    return proseHtml(turn) + notes + '<section class="sec"><div class="sec-head"><h3>' + t('hits') + '</h3></div><div id="hits-' + turn.id + '">' + hitsHtml(turn) + '</div>' +
      '<details class="how"><summary>' + icon('chevron') + t('how') + '</summary>' + meta + '</details></section>' +
      (r.modus === 'wunsch' ? wishHtml(turn) : '');
  }

  function turnHtml(turn) {
    var f = turn.form;
    var meta = [t(f.modus === 'wunsch' ? 'mode_wish' : 'mode_check')].concat(f.modus === 'wunsch' && f.country ? [f.country] : []).concat([f.quellen.map(srcName).join(' + ')]);
    return '<article class="turn" id="turn-' + turn.id + '"><div class="q"><p class="q-bubble">' + esc(f.text) + '</p><p class="q-meta">' + meta.map(esc).join(' · ') + '</p></div>' +
      '<div class="a' + (turn.state === 'run' ? '' : ' in') + '" id="a-' + turn.id + '">' + answerHtml(turn) + '</div></article>';
  }

  // ---------- Seite Abgleich ----------

  function greeting() {
    var h = new Date().getHours(), name = S.ctx && S.ctx.me && S.ctx.me.name ? String(S.ctx.me.name).split(' ')[0] : '';
    return t(h < 11 ? 'morning' : h < 18 ? 'day' : 'evening') + (name ? ', ' + esc(name) : '');
  }

  function matchHtml() {
    var empty = !S.turns.length;
    var ex = empty && S.ctx ? '<div class="suggest">' + (S.ctx.examples || []).slice(0, 3).map(function (e, i) {
      return '<button type="button" data-example="' + i + '"><b>' + esc(e.label) + '</b><span>' + esc(e.text) + '</span></button>';
    }).join('') + '</div>' : '';
    var notices = S.ctx ? (S.ctx.notices || []).filter(String).map(function (n) { return '<div class="note" role="status">' + icon('alert') + '<p>' + esc(n) + '</p></div>'; }).join('') : '';
    return '<header class="topbar">' + (empty ? '' : '<h1>' + t('match') + '</h1>') + '<span class="grow"></span></header>' +
      '<div class="stage' + (empty ? ' is-empty' : '') + '" id="stage"><div class="scroll" id="scroll"><div class="col">' +
      (empty ? '<div class="hero"><p class="hello">' + greeting() + '</p><h1>' + t('hero') + '</h1></div>' + notices
        : '<div class="thread" id="thread">' + notices + S.turns.map(turnHtml).join('') + '</div>') +
      '</div></div><div class="dock"><div class="col">' + composerHtml(empty) + ex + '</div></div></div>';
  }

  // ---------- Seite Daten ----------

  function strip(s, cfg) {
    var max = Math.max(s.len.p99, cfg.chars * 1.25, 1), pct = function (v) { return Math.min(100, 100 * v / max).toFixed(2); };
    return '<div class="strip" role="img" aria-label="' + esc(t('strip_alt', { m: num(s.len.p50), p: num(s.len.p90), c: num(cfg.chars) })) + '">' +
      '<div class="strip-track"><span class="strip-band" style="left:' + pct(s.len.p10) + '%;width:' + (pct(s.len.p90) - pct(s.len.p10)).toFixed(2) + '%"></span>' +
      '<span class="strip-box" style="left:' + pct(s.len.p25) + '%;width:' + Math.max(0.6, pct(s.len.p75) - pct(s.len.p25)).toFixed(2) + '%"></span>' +
      '<span class="strip-median" style="left:' + pct(s.len.p50) + '%"></span><span class="strip-chunk" style="left:' + pct(cfg.chars) + '%"><i>' + t('chunk_mark', { n: num(cfg.chars) }) + '</i></span></div>' +
      '<div class="strip-axis num"><span>0</span><span>' + num(Math.round(max)) + '</span></div></div>';
  }

  function sourceCard(s, rep) {
    var state = (rep.chunks || []).filter(function (c) { return c.source === s.source; })[0] || { chunks: 0, embedded: 0 };
    var st = s.structure || { sample: 0, with_headings: 0, sections_per_doc: 0, section_len: { p50: 0, p75: 0, p90: 0 } };
    var row = function (k, v) { return '<dt>' + k + '</dt><dd class="num">' + v + '</dd>'; };
    var stat = function (n, label) { return '<div><b class="num" data-count="' + (+n || 0) + '">' + num(n) + '</b><span>' + label + '</span></div>'; };
    return '<section class="card" aria-labelledby="h-' + s.source + '"><div class="card-head"><h3 id="h-' + s.source + '">' + icon(s.source === 'jira' ? 'jira' : 'confluence') + t(s.source + '_docs') + '</h3>' +
      '<span class="fine">' + t('sample', { n: num(st.sample) }) + '</span></div>' +
      '<div class="stats">' + stat(s.docs, t('entries')) + stat(state.chunks, t('chunks')) + stat(state.embedded, t('embedded')) + '</div>' +
      '<div><p class="fine">' + t('length') + '</p>' + strip(s, rep.advice) + '</div>' +
      '<dl class="kvs">' + row(t('median'), num(s.len.p50)) + row(t('p90'), num(s.len.p90)) + row(t('longest'), num(s.len.max)) +
      row(t('one_chunk'), (s.single_chunk === undefined ? 100 : s.single_chunk) + ' %') + row(t('with_headings'), st.with_headings + ' %') + row(t('sec_per'), num(st.sections_per_doc)) +
      row(t('sec_len'), num(st.section_len.p50) + ' / ' + num(st.section_len.p75) + ' / ' + num(st.section_len.p90)) +
      row(t('empty'), num(s.empty)) + row(t('dup_titles'), num(s.dup_titles)) + '</dl></section>';
  }

  function groupCard(title, rows) {
    if (!rows || !rows.length) return '';
    var max = rows.reduce(function (a, r) { return Math.max(a, r.n); }, 1);
    return '<section class="card"><h3>' + title + '</h3><ul class="bars">' + rows.slice(0, 8).map(function (r) {
      return '<li class="bar-row"><span class="bar-name">' + esc((S.data.ctx && S.data.ctx.stream_names && S.data.ctx.stream_names[r.name]) || r.name) + '</span><span class="bar-val num">' + num(r.n) + '</span>' +
        '<div class="bar"><span style="--v:' + Math.max(2, 100 * r.n / max).toFixed(1) + '"></span></div></li>';
    }).join('') + '</ul></section>';
  }

  function dataHtml() {
    var d = S.data, ctx = d.ctx, rep = ctx && ctx.report;
    var top = '<header class="topbar"><h1>' + t('data') + '</h1><span class="grow"></span>' + (rep ? '<span class="tag">' + t('store_' + (rep.mode === 'bigquery' ? 'bigquery' : 'memory')) + '</span>' : '') + '</header>';
    var head = '<div class="data-head"><div><h2>' + t('h_data') + '</h2><p>' + t('data_lede') + '</p></div>' +
      '<button type="button" class="btn" data-recalc' + (d.busy ? ' disabled' : '') + '>' + (d.busy ? '<span class="spinner" aria-hidden="true"></span>' : icon('refresh')) + '<span>' + t('recalc') + '</span></button></div>';
    var err = d.error || (ctx && ctx.error);
    var body = err ? '<div class="note is-error" role="alert">' + icon('alert') + '<div><p><b>' + t('failed') + '</b></p><p>' + esc(err) + '</p></div></div>' : '';
    if (!ctx && !err) body += '<div class="think" role="status"><span class="orb" aria-hidden="true"></span><span>' + t('loading') + '</span></div><div class="skel" aria-hidden="true"><i></i><i></i><i></i></div>';
    else if (!rep || !rep.sources.some(function (s) { return s.docs > 0; })) {
      if (!err) body += '<div class="empty"><b>' + t('no_data') + '</b>' + t(ctx && ctx.store === 'bigquery' ? 'sync_none' : 'no_data_hint') + '</div>';
    } else {
      var a = rep.advice;
      body += '<section class="advice" aria-labelledby="h-advice"><h3 id="h-advice">' + t('advice') + '</h3>' +
        '<p class="advice-val"><b class="num" data-count="' + (+a.chars || 0) + '">' + num(a.chars) + '</b><span>' + t('chars_unit') + ', ' + t('overlap', { n: num(a.overlap) }) + '</span></p>' +
        '<div><p class="state' + (a.differs ? ' warn' : '') + '">' + icon(a.differs ? 'alert' : 'check') + (a.differs ? t('advice_change', { c: num(rep.config.chars), o: num(rep.config.overlap) }) : t('advice_ok')) + '</p>' +
        '<ul>' + (a.lines || []).map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul>' +
        '<p class="fine">' + (a.differs ? t('advice_how', { c: a.chars, o: a.overlap }) + ' ' : '') + t('est', { n: num(a.est_chunks), r: num(a.est_runs) }) + '</p></div></section>' +
        '<div class="src-grid">' + rep.sources.filter(function (s) { return s.docs > 0; }).map(function (s) { return sourceCard(s, rep); }).join('') + '</div>' +
        '<div class="groups">' + groupCard(t('g_stream'), rep.groups.stream) + groupCard(t('g_status'), rep.groups.status) + groupCard(t('g_space'), rep.groups.space) +
        (ctx.store === 'bigquery' ? '<section class="card"><h3>' + t('sync') + '</h3>' + (ctx.sync && ctx.sync.length ? '<ul class="sync">' + ctx.sync.map(function (x) {
          return '<li><span class="dot ' + (x.ok ? 'ok' : 'bad') + '" aria-hidden="true"></span><div><span class="sr-only">' + t(x.ok ? 'sync_ok' : 'sync_bad') + ': </span><b>' + srcName(x.source) + '</b> <span class="fine">' + esc(x.at) + '</span><p class="fine">' + esc(x.note) + '</p></div></li>';
        }).join('') + '</ul>' : '<p class="fine">' + t('sync_none') + '</p>') + '</section>' : '') + '</div>';
    }
    return top + '<div class="stage"><div class="scroll" id="scroll"><div class="col"><div class="data" id="data">' + head + body + '</div></div></div></div>';
  }

  /** Jira-Schreibweise lesbar zeigen (Überschriften, fett, Listen). Kopiert wird weiterhin der Jira-Text. */
  function jiraHtml(markup) {
    var out = [], list = false;
    String(markup || '').split('\n').forEach(function (line) {
      var m = /^h([1-6])\.\s*(.*)$/.exec(line), li = /^[*-]\s+(.*)$/.exec(line);
      var txt = function (v) { return esc(v).replace(/\*([^*\n]+)\*/g, '<b>$1</b>'); };
      if (li) { if (!list) { out.push('<ul>'); list = true; } out.push('<li>' + txt(li[1]) + '</li>'); return; }
      if (list) { out.push('</ul>'); list = false; }
      if (m) out.push((+m[1] <= 2 ? '<h3>' : '<h4>') + txt(m[2]) + (+m[1] <= 2 ? '</h3>' : '</h4>'));
      else out.push('<p>' + txt(line) + '</p>');
    });
    if (list) out.push('</ul>');
    return out.join('');
  }

  // ---------- Detailbereich ----------

  function inspHtml() {
    var turn = S.insp && turnById(S.insp.turn);
    if (!turn || !turn.result) return '';
    var close = '<button type="button" class="icon-btn" data-insp-close aria-label="' + t('close') + '">' + icon('x') + '</button>';
    if (S.insp.kind === 'draft') {
      var d = turn.result.draft;
      return '<div class="insp-head">' + icon('draft') + '<span class="fine">' + t('draft') + '</span><span class="grow"></span>' + close + '</div>' +
        '<div class="insp-body"><h2 id="insp-title" tabindex="-1">' + esc(d.title) + '</h2>' +
        '<div class="meta-line"><span class="tag">' + t(d.source === 'gemini' ? 'draft_ai' : 'draft_rule') + '</span>' + (d.country ? '<span class="tag">' + esc(d.country) + '</span>' : '') + '</div>' +
        '<div class="rich">' + jiraHtml(d.markup) + '</div></div>' +
        '<div class="insp-foot"><button type="button" class="btn btn-primary" data-copy="' + turn.id + '">' + icon('copy') + '<span>' + t('copy') + '</span></button></div>';
    }
    var h = turn.result.hits[S.insp.i];
    if (!h) return '';
    var url = safeUrl(h.url), names = (S.ctx && S.ctx.stream_names) || {};
    var kv = function (k, v) { return v ? '<dt>' + k + '</dt><dd>' + v + '</dd>' : ''; };
    var lvl = h.level === 'duplicate' || h.level === 'similar' || h.level === 'related' ? h.level : 'new';
    return '<div class="insp-head">' + icon(h.source === 'confluence' ? 'confluence' : 'jira') + '<span class="mono">' + esc(h.id) + '</span>' + lvlChip(h.level) + '<span class="grow"></span>' + close + '</div>' +
      '<div class="insp-body in"><h2 id="insp-title" tabindex="-1">' + esc(h.title) + '</h2>' +
      '<div class="meter lvl-' + lvl + '" style="background:none"><b class="num">' + num(h.score) + ' %</b><div class="bar"><span style="--v:' + Math.max(0, Math.min(100, +h.score || 0)) + '"></span></div></div>' +
      '<dl class="kvs">' + kv(t('status'), esc(calm(h.status))) + kv('Stream', esc(names[h.stream] || h.stream)) + kv(t('epic'), h.epic ? '<span class="mono">' + esc(h.epic) + '</span>' : '') +
      kv(t('space'), esc(h.space)) + kv(t('updated'), h.updated ? esc(new Date(h.updated).toLocaleDateString(S.lang === 'en' ? 'en-GB' : 'de-DE')) : '') +
      kv(t('found_by'), [h.by_keyword ? t('by_keyword') : '', h.by_meaning ? t('by_meaning') : ''].filter(Boolean).join(' + ')) + '</dl>' +
      '<div><h3>' + t('passages') + '</h3>' + (h.passages || []).map(function (p) { return '<p class="passage">' + (p.heading ? '<b>' + esc(p.heading) + '</b>' : '') + esc(p.text) + '</p>'; }).join('') +
      (h.n_passages > (h.passages || []).length ? '<p class="fine" style="margin-top:8px">' + t('more_spots', { n: h.n_passages - h.passages.length }) + '</p>' : '') + '</div></div>' +
      (url ? '<div class="insp-foot"><a class="btn btn-primary" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + icon('out') + '<span>' + t('open_in', { s: srcName(h.source) }) + '</span></a></div>' : '');
  }

  // ---------- Zeichnen ----------

  var app = document.getElementById('app');

  function mainHtml() {
    if (S.fatal) {
      return '<header class="topbar"><h1>' + esc(window.APP_NAME || '') + '</h1></header><div class="stage"><div class="col"><div class="note is-error" role="alert">' + icon('alert') + '<div><p><b>' + t('failed') + '</b></p><p>' + esc(S.fatal) + '</p></div></div>' +
        '<p style="margin-top:14px"><button type="button" class="btn" data-reload>' + icon('refresh') + '<span>' + t('retry') + '</span></button></p></div></div>';
    }
    return S.path === '/daten' ? dataHtml() : matchHtml();
  }

  function pills(instant) {
    var o = instant ? { instant: true } : undefined;
    if ($('nav')) M.pill($('nav'), o);
    if ($('lang')) M.pill($('lang'), o);
    if ($('mode')) M.pill($('mode'), instant ? { instant: true, active: 'label:has(input:checked)' } : { active: 'label:has(input:checked)' });
  }

  function afterMain() {
    document.documentElement.lang = S.lang;
    document.title = (S.path === '/daten' ? t('data') : t('match')) + ' · ' + (window.APP_NAME || '');
    var d = $('data');
    if (d) raf(function () { d.classList.add('in'); });
    pills(true);
  }

  function drawAll() {
    var insp = inspHtml();
    app.innerHTML = '<a class="skip" href="#main">' + t('skip') + '</a><div class="app" id="shell" data-side="' + S.side + '" data-insp="' + (insp ? 1 : 0) + '">' +
      '<aside class="side" id="side">' + sideHtml() + '</aside><main class="main" id="main" tabindex="-1">' + mainHtml() + '</main>' +
      '<button type="button" class="scrim" data-insp-close tabindex="-1" aria-label="' + t('close') + '"></button><aside class="insp" id="insp" aria-labelledby="insp-title"' + (insp ? '' : ' hidden') + '>' + insp + '</aside></div><div class="live" id="live" role="status" aria-live="polite"></div><div class="sr-only" id="say" role="status" aria-live="polite"></div>';
    afterMain();
  }

  function drawMain() { var m = $('main'); if (!m) { drawAll(); return; } m.innerHTML = mainHtml(); afterMain(); }
  function drawSide() { var s = $('side'); if (s) { s.innerHTML = sideHtml(); pills(true); } }
  function drawHist() { var h = $('hist'); if (h) h.innerHTML = histHtml(); }
  function drawInsp() {
    var p = $('insp'), sh = $('shell'), html = inspHtml();
    if (!p || !sh) return;
    p.innerHTML = html; p.hidden = !html; sh.dataset.insp = html ? '1' : '0';
    modal();
    Array.prototype.forEach.call(document.querySelectorAll('.hit.is-open, .artifact.is-open'), function (el) {
      el.classList.remove('is-open'); var b = el.querySelector('[aria-expanded]'); if (b) b.setAttribute('aria-expanded', 'false');
    });
    var row = S.insp ? document.querySelector(S.insp.kind === 'draft' ? '[data-draft-row="' + S.insp.turn + '"]' : '[data-hit-row="' + S.insp.turn + '-' + S.insp.i + '"]') : null;
    if (row) { row.classList.add('is-open'); var b = row.querySelector('[aria-expanded]'); if (b) b.setAttribute('aria-expanded', 'true'); }
  }
  /** Unter 1180 px liegt der Detailbereich über der Seite: dann ist er ein Dialog und der Rest nicht bedienbar. */
  function modal() {
    var p = $('insp'), on = !!(p && !p.hidden && window.matchMedia && window.matchMedia('(max-width: 1180px)').matches);
    ['side', 'main'].forEach(function (id) { var el = $(id); if (el) el.inert = on; });
    if (!p) return;
    if (on) { p.setAttribute('role', 'dialog'); p.setAttribute('aria-modal', 'true'); } else { p.removeAttribute('role'); p.removeAttribute('aria-modal'); }
  }
  function scrollEnd() { var s = $('scroll'); if (s) s.scrollTop = s.scrollHeight; }
  function scrollToTurn(turn) { var el = $('turn-' + turn.id), s = $('scroll'); if (el && s) s.scrollTop = Math.max(0, el.offsetTop - 12); }

  function readForm() {
    var f = $('composer');
    if (!f || typeof FormData !== 'function') return;
    var data = new FormData(f);
    S.form.text = String(data.get('text') || '');
    S.form.modus = data.get('modus') === 'wunsch' ? 'wunsch' : 'pruefen';
    S.form.quellen = data.getAll('quelle').map(String);
    if (data.get('country')) S.form.country = String(data.get('country'));
  }

  function hint(text, isError) {
    var h = $('hint');
    if (!h) return;
    h.textContent = text; h.className = isError ? 'err' : '';
    var ta = $('text'); if (ta) { if (isError) ta.setAttribute('aria-invalid', 'true'); else ta.removeAttribute('aria-invalid'); }
  }

  function setBusy(on) {
    S.busy = on;
    var b = $('send');
    if (!b) return;
    b.disabled = on; b.setAttribute('aria-label', t(on ? 'running' : 'run'));
    M.swap(b, on ? '<span class="spinner" aria-hidden="true"></span>' : icon('send'));
  }

  function say(text) { var el = $('say'); if (el) el.textContent = text; }

  function toast(text) {
    var l = $('live');
    if (!l) return;
    l.innerHTML = '<span class="toast">' + icon('check') + '<span>' + esc(text) + '</span></span>';
    var el = l.firstChild;
    M.enter(el, { y: 16 });
    setTimeout(function () { if (el.parentNode === l) M.exit(el).then(function () { if (el.parentNode === l) l.removeChild(el); }); }, 2200);
  }

  // ---------- Ablauf ----------

  function revealAnswer(turn) {
    var a = $('a-' + turn.id);
    if (!a) return;
    M.exit(a).then(function () {
      a.innerHTML = answerHtml(turn);
      M.enter(a.children, { stagger: 90 });
      Array.prototype.forEach.call(a.querySelectorAll('.prose'), function (p, i) { setTimeout(function () { M.words(p); }, i * 320); });
      Array.prototype.forEach.call(a.querySelectorAll('[data-count]'), function (el) { M.count(el, +el.getAttribute('data-count'), { format: function (n) { return num(Math.round(n)) + ' %'; } }); });
      raf(function () { a.classList.add('in'); });
      scrollToTurn(turn);
      var h = $('h-verdict-' + turn.id) || a.querySelector('[role=alert]');
      if (h && h.focus && document.activeElement && document.activeElement.id !== 'text') h.focus({ preventScroll: true });
    });
  }

  function runTurn(turn) {
    turn.state = 'run'; turn.step = 0; turn.result = null; turn.error = '';
    setBusy(true);
    say(t('running'));
    var timer = setInterval(function () {
      if (turn.step >= 2) return;
      turn.step += 1;
      var el = $('step-' + turn.id);
      if (el) M.swap(el, '<span>' + t('step' + (turn.step + 1)) + '</span>');
    }, 1700);
    var f = turn.form;
    api('POST', '/abgleich', { text: [f.text], modus: [f.modus], country: [f.country], quelle: f.quellen }).then(function (d) {
      turn.result = d.ctx.result || null; turn.error = d.ctx.error || '';
      if (turn.result) remember(f, turn.result.verdict.level === 'duplicate' || turn.result.verdict.level === 'similar' ? turn.result.verdict.level : 'new', turn.result);
    }).catch(function (e) { turn.error = msg(e); }).then(function () {
      clearInterval(timer);
      turn.state = turn.result ? 'done' : 'error';
      setBusy(false);
      drawHist();
      var lv = turn.result ? turn.result.verdict.level : '';
      say(turn.result ? t('v_' + (lv === 'duplicate' || lv === 'similar' ? lv : 'new')) : t('failed') + ': ' + turn.error);
      revealAnswer(turn);
    });
  }

  function submit() {
    if (S.busy) return;
    readForm();
    var text = S.form.text.trim();
    if (text.length < 12) { hint(t('too_short'), true); var ta = $('text'); if (ta) ta.focus(); return; }
    if (!S.form.quellen.length) { hint(t('no_source'), true); return; }
    var turn = { id: ++S.seq, form: { text: text, modus: S.form.modus, country: S.form.country, quellen: S.form.quellen.slice() }, state: 'run', step: 0, all: false };
    var first = !S.turns.length || !$('thread');
    S.form.text = '';
    S.busy = true;
    if (first) {
      M.morph(function () { S.turns.push(turn); drawMain(); }, { type: 'dock' }).then(function () { var ta = $('text'); if (ta) ta.focus(); });
    } else {
      S.turns.push(turn);
      $('thread').insertAdjacentHTML('beforeend', turnHtml(turn));
      var ta = $('text'); if (ta) ta.value = '';
      hint(t(S.form.modus === 'wunsch' ? 'hint_wish' : 'hint_check'));
      var el = $('turn-' + turn.id);
      M.enter(el.children, { stagger: 80 });
      scrollEnd();
    }
    runTurn(turn);
  }

  function fresh() {
    if (S.busy) return;
    var go = function () { S.turns = []; S.insp = null; S.form.text = ''; S.path = '/abgleich'; drawAll(); };
    if (location.hash.replace(/^#/, '') === '/daten') { S.turns = []; S.insp = null; location.hash = '#/abgleich'; return; }
    M.morph(go, { type: 'dock' }).then(function () { var ta = $('text'); if (ta) ta.focus(); });
  }

  function openInsp(turnId, kind, i, origin) {
    var same = S.insp && S.insp.turn === turnId && S.insp.kind === kind && S.insp.i === i;
    if (same) { closeInsp(); return; }
    var row = !S.insp && origin && origin.closest('.hit, .artifact');
    if (row) row.style.viewTransitionName = 'inspect';
    M.morph(function () {
      if (row) row.style.viewTransitionName = '';
      S.insp = { turn: turnId, kind: kind, i: i };
      drawInsp();
      var p = $('insp'); if (p && row) p.style.viewTransitionName = 'inspect';
    }, { type: 'inspect' }).then(function () {
      var p = $('insp'); if (p) p.style.viewTransitionName = '';
      var h = $('insp-title'); if (h) h.focus({ preventScroll: true });
      raf(function () { var b = document.querySelector('#insp .insp-body'); if (b) b.classList.add('in'); });
    });
  }

  /** quick: von der Tastatur ausgelöst, dann ohne Übergang. */
  function closeInsp(quick) {
    if (!S.insp) return;
    var was = S.insp;
    var shut = function () { S.insp = null; drawInsp(); };
    (quick ? Promise.resolve(shut()) : M.morph(shut, { type: 'close' })).then(function () {
      var back = document.querySelector(was.kind === 'draft' ? '[data-draft-row="' + was.turn + '"] [data-draft]' : '[data-hit-row="' + was.turn + '-' + was.i + '"] .hit-main');
      if (back) back.focus({ preventScroll: true });
    });
  }

  function copyText(text, btn) {
    var done = function () {
      toast(t('copied_toast'));
      if (!btn) return;
      M.swap(btn, icon('check') + '<span>' + t('copied') + '</span>');
      setTimeout(function () { if (btn.isConnected) M.swap(btn, icon('copy') + '<span>' + t('copy') + '</span>'); }, 1800);
    };
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { /* dann von Hand markieren */ }
      document.body.removeChild(ta);
      if (btn && btn.focus) btn.focus({ preventScroll: true });
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  }

  function loadData(fresh) {
    S.data.busy = true; S.data.error = '';
    if (S.path === '/daten') drawMain();
    var boot = !fresh && window.BOOT && window.BOOT.path === '/daten' ? window.BOOT.promise.then(function (text) { var d = JSON.parse(text); if (d.fatal) throw new Error(d.fatal); return d; }) : api('GET', '/daten', fresh ? { neu: ['1'] } : {});
    window.BOOT = null;
    return boot.then(function (d) { S.data.ctx = d.ctx; }).catch(function (e) { S.data.error = msg(e); }).then(function () {
      S.data.busy = false;
      if (S.path !== '/daten') return;
      drawMain();
      if (fresh) { var rb = document.querySelector('[data-recalc]'); if (rb) rb.focus({ preventScroll: true }); }
      var el = $('data');
      if (el) {
        M.enter(el.children, { stagger: 70 });
        Array.prototype.forEach.call(el.querySelectorAll('[data-count]'), function (n) { M.count(n, +n.getAttribute('data-count'), { format: function (v) { return num(Math.round(v)); } }); });
      }
    });
  }

  function go(path) {
    readForm();
    S.path = path === '/daten' ? '/daten' : '/abgleich';
    S.insp = null;
    drawAll();
    if (S.path === '/daten') { if (!S.data.ctx || S.data.error) loadData(false); }
    else if (!S.ctx) boot();
    var m = $('main'); if (m && m.firstChild) { M.enter(m.querySelector('.col'), { y: 8 }); m.focus({ preventScroll: true }); }
  }

  function boot() {
    var first = window.BOOT && window.BOOT.path === '/abgleich' ? window.BOOT.promise.then(function (text) { var d = JSON.parse(text); if (d.fatal) throw new Error(d.fatal); return d; }) : api('GET', '/abgleich', {});
    window.BOOT = null;
    return first.then(function (d) {
      S.ctx = d.ctx; S.fatal = '';
      if (!S.form.country) S.form.country = d.ctx.form.country;
      if ((d.ctx.result || d.ctx.error) && d.ctx.form && d.ctx.form.text && !S.turns.length) {
        S.turns.push({ id: ++S.seq, form: d.ctx.form, state: d.ctx.result ? 'done' : 'error', result: d.ctx.result, error: d.ctx.error || '', all: false });
      }
      drawAll();
      var hero = document.querySelector('.stage.is-empty .col');
      if (hero) M.enter([hero.querySelector('.hero')].concat(Array.prototype.slice.call(document.querySelectorAll('.dock .col > *'))), { stagger: 90 });
    }).catch(function (e) { S.fatal = msg(e); drawAll(); });
  }

  // ---------- Bedienen ----------

  app.addEventListener('submit', function (e) { if (e.target.id === 'composer') { e.preventDefault(); submit(); } });
  app.addEventListener('keydown', function (e) {
    if (e.target.id === 'text' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); return; }
  });
  if (document.addEventListener) document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.insp) { e.preventDefault(); closeInsp(true); } });
  app.addEventListener('input', function (e) { if (e.target.id === 'text') { var h = $('hint'); if (h && h.className === 'err') hint(t(S.form.modus === 'wunsch' ? 'hint_wish' : 'hint_check')); } });
  app.addEventListener('change', function (e) {
    if (e.target.name !== 'modus' && e.target.name !== 'quelle' && e.target.name !== 'country') return;
    readForm();
    if (e.target.name !== 'modus') { hint(t(S.form.modus === 'wunsch' ? 'hint_wish' : 'hint_check')); return; }
    var wish = S.form.modus === 'wunsch', box = $('country-box');
    hint(t(wish ? 'hint_wish' : 'hint_check'));
    if (box && S.ctx && (S.ctx.countries || []).length) { var was = box.hidden; box.hidden = !wish; if (was && wish) M.enter(box, { y: 0 }); }
    pills();
  });
  app.addEventListener('mouseover', function (e) { light(e, true); });
  app.addEventListener('mouseout', function (e) { light(e, false); });
  function light(e, on) {
    var c = e.target.closest && e.target.closest('.cite');
    if (!c) return;
    var row = document.querySelector('[data-hit-row="' + c.getAttribute('data-turn') + '-' + c.getAttribute('data-hit') + '"]');
    if (row) row.classList.toggle('is-lit', on);
  }

  app.addEventListener('click', function (e) {
    var el = e.target.closest('button, a');
    if (!el) return;
    if (el.classList.contains('skip')) { e.preventDefault(); var mm = $('main'); if (mm) mm.focus(); return; }
    if (el.hasAttribute('data-lang')) { readForm(); S.lang = el.getAttribute('data-lang') === 'en' ? 'en' : 'de'; store.set('lang', S.lang); drawAll(); var l = document.querySelector('[data-lang="' + S.lang + '"]'); if (l) l.focus(); return; }
    if (el.hasAttribute('data-theme-toggle')) {
      var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      M.morph(function () { document.documentElement.dataset.theme = next; }, { type: 'theme' });
      store.set('theme', next);
      el.setAttribute('aria-label', t(next === 'dark' ? 'theme_light' : 'theme_dark'));
      M.swap(el, icon(next === 'dark' ? 'sun' : 'moon'));
      return;
    }
    if (el.hasAttribute('data-side-toggle')) {
      S.side = S.side === 'open' ? 'closed' : 'open'; store.set('side', S.side);
      M.morph(function () { $('shell').dataset.side = S.side; drawSide(); }, { type: 'side' }).then(function () { var b = document.querySelector('[data-side-toggle]'); if (b) b.focus(); });
      return;
    }
    if (el.hasAttribute('data-new')) { fresh(); return; }
    if (el.hasAttribute('data-example') && S.ctx) { var ex = S.ctx.examples[+el.getAttribute('data-example')]; if (ex) { var ta = $('text'); if (ta) ta.value = ex.text; submit(); } return; }
    if (el.hasAttribute('data-hist')) {
      var r = history()[+el.getAttribute('data-hist')];
      if (!r || S.busy) return;
      S.form = { text: r.text, modus: r.modus === 'wunsch' ? 'wunsch' : 'pruefen', country: r.country || S.form.country, quellen: Array.isArray(r.quellen) && r.quellen.length ? r.quellen : ['jira', 'confluence'] };
      S.turns = []; S.insp = null; S.path = '/abgleich';
      if (r.result && r.result.verdict) {
        var f = S.form;
        S.turns = [{ id: ++S.seq, form: { text: f.text, modus: f.modus, country: f.country, quellen: f.quellen.slice() }, state: 'done', result: r.result, error: '', all: false }];
        S.form.text = '';
        if (location.hash.replace(/^#/, '') === '/daten') { location.hash = '#/abgleich'; return; }
        M.morph(function () { drawAll(); }, { type: 'dock' }).then(function () { var h = $('h-verdict-' + S.seq); if (h) h.focus({ preventScroll: true }); });
        return;
      }
      if (location.hash.replace(/^#/, '') === '/daten') { S.pending = true; location.hash = '#/abgleich'; return; }
      drawAll(); submit();
      return;
    }
    if (el.hasAttribute('data-hit')) { openInsp(+el.getAttribute('data-turn'), 'hit', +el.getAttribute('data-hit'), el.classList.contains('cite') ? document.querySelector('[data-hit-row="' + el.getAttribute('data-turn') + '-' + el.getAttribute('data-hit') + '"] .hit-main') : el); return; }
    if (el.hasAttribute('data-draft')) { openInsp(+el.getAttribute('data-turn'), 'draft', 0, el); return; }
    if (el.hasAttribute('data-insp-close')) { closeInsp(); return; }
    if (el.hasAttribute('data-as-wish')) {
      var tw = turnById(el.getAttribute('data-as-wish'));
      if (!tw || S.busy) return;
      S.form.modus = 'wunsch';
      var box = $('text'); if (box) box.value = tw.form.text;
      var radio = document.querySelector('input[name=modus][value=wunsch]'); if (radio) radio.checked = true;
      var cb = $('country-box'); if (cb && S.ctx && (S.ctx.countries || []).length) cb.hidden = false;
      pills(); submit();
      return;
    }
    if (el.hasAttribute('data-more')) {
      var turn = turnById(el.getAttribute('data-more')), box = turn && $('hits-' + turn.id);
      if (!box) return;
      M.flip($('turn-' + turn.id), function () { turn.all = !turn.all; box.innerHTML = hitsHtml(turn); }).then(function () { var b = box.querySelector('.more-btn'); if (b) b.focus({ preventScroll: true }); });
      return;
    }
    if (el.hasAttribute('data-copy')) { var tc = turnById(el.getAttribute('data-copy')); if (tc && tc.result && tc.result.draft) copyText(tc.result.draft.markup || '', el); return; }
    if (el.hasAttribute('data-again')) { var ta2 = turnById(el.getAttribute('data-again')); if (ta2 && !S.busy) { ta2.state = 'run'; ta2.step = 0; var a = $('a-' + ta2.id); if (a) { a.classList.remove('in'); a.innerHTML = answerHtml(ta2); } runTurn(ta2); } return; }
    if (el.hasAttribute('data-recalc')) { if (!S.data.busy) loadData(true); return; }
    if (el.hasAttribute('data-reload')) { S.fatal = ''; boot(); }
  });

  window.addEventListener('hashchange', function () {
    var p = location.hash.replace(/^#/, '') === '/daten' ? '/daten' : '/abgleich';
    if (p === S.path && !S.pending) return;
    go(p);
    if (S.pending) { S.pending = false; submit(); }
  });
  window.addEventListener('resize', function () { pills(true); modal(); });

  M.init();
  S.path = window.BOOT ? window.BOOT.path : (location.hash.replace(/^#/, '') === '/daten' ? '/daten' : '/abgleich');
  if (S.path === '/daten') { drawAll(); loadData(false); } else boot();
})();
</script>
