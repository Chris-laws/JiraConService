<style>
/* Oberfläche im Stil heutiger Wissens- und KI-Assistenten: Verlauf links, Gespräch in der Mitte, Details rechts.
   Farben und Maße stehen als Variablen oben; Bewegung kommt aus JsMotion (Federn als --spring-*, Dauer als --dur-*). */
:root {
  --bg: #f3f4f7; --panel: #ffffff; --sunken: #e9ecf1; --raised: #ffffff;
  --ink: #0d131e; --ink-2: #434c5b; --ink-3: #5f6877;
  --line: rgba(13, 19, 30, .1); --line-strong: rgba(13, 19, 30, .18); --edge: #858c98;
  --accent: #0050aa; --accent-hover: #00438f; --on-accent: #ffffff; --accent-soft: #e4eefb; --accent-ink: #00458f;
  --mark: #ffcf00; --mark-ink: #3d3200;
  --dup: #b3102b; --dup-soft: #fde7eb; --sim: #7a4d00; --sim-soft: #fff1c7; --rel: #00458f; --rel-soft: #e4eefb; --new: #0b6b43; --new-soft: #dff4ea;
  --shadow-1: 0 0 0 1px rgba(13, 19, 30, .06), 0 1px 2px rgba(13, 19, 30, .05);
  --shadow-2: 0 0 0 1px rgba(13, 19, 30, .07), 0 2px 4px rgba(13, 19, 30, .04), 0 12px 32px -8px rgba(13, 19, 30, .14);
  --shadow-3: 0 0 0 1px rgba(13, 19, 30, .08), 0 8px 16px -4px rgba(13, 19, 30, .08), 0 28px 64px -16px rgba(13, 19, 30, .22);
  --r-s: 8px; --r-m: 12px; --r-l: 16px; --r-xl: 24px;
  --side-w: 272px; --insp-w: 440px; --col: 780px;
  --font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  --spring-snappy: cubic-bezier(.2, 0, 0, 1); --spring-smooth: cubic-bezier(.2, 0, 0, 1); --spring-bouncy: cubic-bezier(.2, 0, 0, 1); --spring-soft: cubic-bezier(.2, 0, 0, 1);
  --dur-snappy: 300ms; --dur-smooth: 500ms; --dur-bouncy: 500ms; --dur-soft: 700ms;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0a0d12; --panel: #131821; --sunken: #1a202b; --raised: #1b222e;
  --ink: #eef1f6; --ink-2: #b6bdca; --ink-3: #939cab;
  --line: rgba(255, 255, 255, .09); --line-strong: rgba(255, 255, 255, .18); --edge: #747d8c;
  --accent: #2a6fd0; --accent-hover: #3a7fde; --on-accent: #ffffff; --accent-soft: rgba(72, 141, 240, .16); --accent-ink: #8dbcff;
  --mark: #ffd633; --mark-ink: #2b2300;
  --dup: #ff8296; --dup-soft: rgba(255, 92, 120, .16); --sim: #f4c95a; --sim-soft: rgba(244, 201, 90, .14); --rel: #8dbcff; --rel-soft: rgba(72, 141, 240, .16); --new: #5fd9a3; --new-soft: rgba(95, 217, 163, .14);
  --shadow-1: 0 0 0 1px rgba(255, 255, 255, .07);
  --shadow-2: 0 0 0 1px rgba(255, 255, 255, .09), 0 12px 32px -8px rgba(0, 0, 0, .6);
  --shadow-3: 0 0 0 1px rgba(255, 255, 255, .1), 0 28px 64px -16px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body, #app { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--font); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; overflow: hidden; }
h1, h2, h3, p, ul, ol, dl, dd, pre { margin: 0; }
ul, ol { padding: 0; list-style: none; }
h1, h2, h3 { text-wrap: balance; font-weight: 600; }
p { text-wrap: pretty; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--accent-ink); text-underline-offset: 3px; }
[hidden] { display: none !important; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--mono); letter-spacing: -.02em; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; border-radius: 6px; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 50; padding: 8px 14px; border-radius: var(--r-s); background: var(--ink); color: var(--bg); text-decoration: none; }
.skip:focus { top: 12px; }

.boot { height: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--ink-2); }
.spinner { width: 16px; height: 16px; flex: none; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: currentColor; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Rahmen ---------- */
.app { height: 100%; display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr) 0; }
.app[data-side="closed"] { grid-template-columns: 64px minmax(0, 1fr) 0; }
.app[data-insp="1"] { grid-template-columns: var(--side-w) minmax(0, 1fr) var(--insp-w); }
.app[data-insp="1"][data-side="closed"] { grid-template-columns: 64px minmax(0, 1fr) var(--insp-w); }

.side { display: flex; flex-direction: column; min-height: 0; padding: 12px; gap: 4px; view-transition-name: side; }
.side-head { display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 4px 0 6px; margin-bottom: 8px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; letter-spacing: -.02em; min-width: 0; }
.brand img { flex: none; border-radius: 50%; }
.brand span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn { position: relative; width: 36px; height: 36px; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; color: var(--ink-2); transition: background-color .15s, color .15s, transform var(--dur-snappy) var(--spring-snappy); }
.icon-btn::after { content: ""; position: absolute; inset: -2px; }
.icon-btn:hover { background: var(--sunken); color: var(--ink); }
.icon-btn:active { transform: scale(.96); }

.new-btn { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: var(--r-m); background: var(--panel); box-shadow: var(--shadow-1); font-weight: 600; text-align: left; transition: box-shadow .15s, transform var(--dur-snappy) var(--spring-snappy); }
.new-btn:hover { box-shadow: var(--shadow-2); }
.new-btn:active { transform: scale(.96); }
.new-btn .ic { color: var(--accent-ink); }
.new-btn kbd { margin-left: auto; font: 500 12px var(--mono); color: var(--ink-3); }

.nav { position: relative; display: flex; flex-direction: column; gap: 2px; margin-top: 12px; }
.nav a { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 12px; border-radius: 10px; color: var(--ink-2); text-decoration: none; font-weight: 500; transition: color .15s; }
.nav a:hover { color: var(--ink); }
.nav a[aria-current="page"] { color: var(--ink); }
.pill { position: absolute; left: 0; top: 0; z-index: 0; border-radius: 10px; background: var(--sunken); pointer-events: none; transition: transform var(--dur-snappy) var(--spring-snappy), width var(--dur-snappy) var(--spring-snappy), opacity .15s; }

.hist { display: flex; flex-direction: column; min-height: 0; flex: 1; margin-top: 18px; }
.hist h2 { padding: 0 12px 6px; font-size: 13px; font-weight: 500; color: var(--ink-3); }
.hist-list { overflow-y: auto; min-height: 0; margin: 0 -4px; padding: 0 4px 8px; scrollbar-width: thin; }
.hist-item { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 6px 12px; border-radius: 10px; text-align: left; color: var(--ink-2); transition: background-color .15s, color .15s; }
.hist-item:hover { background: var(--sunken); color: var(--ink); }
.hist-item span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.hist-empty { padding: 4px 12px; font-size: 14px; color: var(--ink-3); }
.dot { width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--ink-3); }
.dot.lvl-duplicate { background: var(--dup); } .dot.lvl-similar { background: var(--sim); } .dot.lvl-related { background: var(--rel); } .dot.lvl-new { background: var(--new); }

.side-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 4px 0; }
.seg { position: relative; display: inline-flex; padding: 3px; border-radius: 11px; background: var(--sunken); }
.seg .pill { background: var(--panel); border-radius: 8px; box-shadow: var(--shadow-1); }
.seg-btn, .seg label { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--ink-2); cursor: pointer; white-space: nowrap; transition: color .15s; }
.seg-btn[aria-pressed="true"], .seg label:has(input:checked) { color: var(--ink); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent-ink); outline-offset: 1px; }
.seg-btn::after, .seg label::after { content: ""; position: absolute; inset: -5px 0; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }

.app[data-side="closed"] .side { align-items: center; padding: 12px 8px; }
.app[data-side="closed"] .brand span, .app[data-side="closed"] .new-btn span, .app[data-side="closed"] .new-btn kbd, .app[data-side="closed"] .nav a span,
.app[data-side="closed"] .hist, .app[data-side="closed"] .side-foot .seg { display: none; }
.app[data-side="closed"] .side-head { flex-direction: column; height: auto; gap: 8px; padding: 0; }
.app[data-side="closed"] .new-btn, .app[data-side="closed"] .nav a { width: 40px; padding: 0; justify-content: center; }
.app[data-side="closed"] .side-foot { margin-top: auto; padding: 0; }

/* ---------- Mitte ---------- */
.main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; margin: 8px 8px 8px 0; border-radius: var(--r-xl); background: var(--panel); box-shadow: var(--shadow-1); overflow: hidden; view-transition-name: main; }
.main:focus { outline: none; }
.topbar { display: flex; align-items: center; gap: 8px; height: 52px; flex: none; padding: 0 16px 0 20px; }
.topbar h1, .topbar .crumb { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.topbar .grow { flex: 1; }
.topbar .bar-only { display: none; }
.tag { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px; background: var(--sunken); color: var(--ink-2); font-size: 13px; font-weight: 500; white-space: nowrap; }

.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scroll { position: relative; flex: 1; min-height: 0; overflow-y: auto; scroll-behavior: smooth; scrollbar-gutter: stable both-edges; }
.col { width: 100%; max-width: calc(var(--col) + 48px); margin: 0 auto; padding: 0 24px; }
.stage.is-empty { justify-content: center; padding-bottom: 9vh; }
.stage.is-empty .scroll { flex: none; overflow: visible; }
.stage:not(.is-empty) .scroll { mask-image: linear-gradient(to bottom, transparent 0, #000 20px, #000 calc(100% - 28px), transparent 100%); }

.hero { padding: 0 0 22px; }
.hero .hello { color: var(--ink-3); font-size: 15px; margin-bottom: 6px; }
.hero h1 { font-size: clamp(30px, 3.4vw, 42px); line-height: 1.08; letter-spacing: -.035em; font-weight: 600; }

/* Eingabe */
.dock { flex: none; padding: 0 0 14px; }
.stage.is-empty .dock { padding: 0; }
.composer { position: relative; border-radius: var(--r-xl); background: var(--raised); box-shadow: 0 0 0 1px var(--edge), var(--shadow-2); transition: box-shadow .2s; view-transition-name: composer; }
.composer:focus-within { box-shadow: 0 0 0 1.5px var(--accent-ink), 0 2px 4px rgba(13, 19, 30, .04), 0 16px 40px -8px rgba(0, 80, 170, .22); }
.composer textarea { display: block; width: 100%; min-height: 56px; max-height: 34vh; padding: 18px 20px 6px; border: 0; background: none; resize: none; outline: 2px solid transparent; font-size: 16px; line-height: 1.5; field-sizing: content; }
.stage.is-empty .composer textarea { min-height: 92px; }
.composer textarea::placeholder { color: var(--ink-3); }
.composer-bar { display: flex; align-items: flex-end; gap: 8px; padding: 8px 10px 10px 12px; }
.bar-left { flex: 1; min-width: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.composer-bar .grow { flex: 1; }
.tog { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--edge); color: var(--ink-2); font-size: 14px; font-weight: 500; cursor: pointer; transition: background-color .15s, color .15s, box-shadow .15s, transform var(--dur-snappy) var(--spring-snappy); }
.tog input { position: absolute; opacity: 0; pointer-events: none; }
.tog:active { transform: scale(.96); }
.tog:has(input:checked) { background: var(--accent-soft); color: var(--accent-ink); box-shadow: inset 0 0 0 1.5px var(--accent-ink); }
.tog .chk { display: none; }
.tog:has(input:checked) .chk { display: block; }
.tog:has(input:checked) .src { display: none; }
.tog:has(input:focus-visible) { outline: 2px solid var(--accent-ink); outline-offset: 2px; }
.tog .ic { width: 16px; height: 16px; }
.sel { position: relative; display: inline-flex; align-items: center; }
.sel select { appearance: none; height: 36px; padding: 0 30px 0 12px; border: 0; border-radius: 999px; background: none; box-shadow: inset 0 0 0 1px var(--edge); color: var(--ink-2); font-size: 14px; font-weight: 500; cursor: pointer; }
.sel .ic { position: absolute; right: 9px; width: 15px; height: 15px; pointer-events: none; color: var(--ink-3); }
.send { position: relative; width: 40px; height: 40px; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--accent); color: var(--on-accent); transition: background-color .15s, transform var(--dur-snappy) var(--spring-snappy), opacity .15s; }
.send:hover { background: var(--accent-hover); }
.send:active { transform: scale(.96); }
.send[disabled] { opacity: .45; cursor: default; }
.send .ic { width: 20px; height: 20px; stroke-width: 2; }
.send .spinner { border-color: rgba(255, 255, 255, .35); border-top-color: #fff; }
.dock-note { display: flex; justify-content: space-between; gap: 16px; padding: 8px 8px 0; font-size: 13px; color: var(--ink-3); min-height: 27px; }
.dock-note .keys { white-space: nowrap; }
.stage:not(.is-empty) .dock-note .keys, .stage:not(.is-empty) #hint:not(.err) { display: none; }
.stage:not(.is-empty) .dock-note { min-height: 0; padding-top: 0; }
.stage:not(.is-empty) .dock-note:has(.err) { padding-top: 8px; }
.dock-note .err { color: var(--dup); font-weight: 500; }

.suggest { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin-top: 18px; }
.suggest button { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: var(--r-l); box-shadow: inset 0 0 0 1px var(--line); text-align: left; transition: background-color .15s, box-shadow .15s, transform var(--dur-snappy) var(--spring-snappy); }
.suggest button:hover { background: var(--bg); box-shadow: inset 0 0 0 1px var(--line-strong); }
.suggest button:active { transform: scale(.96); }
.suggest b { font-size: 14px; font-weight: 600; }
.suggest span { font-size: 14px; line-height: 1.45; color: var(--ink-3); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* ---------- Gespräch ---------- */
.thread { padding: 20px 0 48px; display: flex; flex-direction: column; gap: 36px; }
.turn { display: flex; flex-direction: column; gap: 18px; }
.q { align-self: flex-end; max-width: 82%; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.q-bubble { padding: 11px 16px; border-radius: 20px 20px 6px 20px; background: var(--sunken); white-space: pre-wrap; overflow-wrap: anywhere; }
.q-meta { display: flex; gap: 6px; font-size: 13px; color: var(--ink-3); }
.a { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.think { display: flex; align-items: center; gap: 10px; color: var(--ink-2); min-height: 28px; }
.think .orb { width: 10px; height: 10px; border-radius: 50%; background: var(--accent-ink); animation: orb 1.2s ease-in-out infinite; }
@keyframes orb { 0%, 100% { transform: scale(.6); opacity: .5; } 50% { transform: scale(1); opacity: 1; } }
.skel { display: flex; flex-direction: column; gap: 10px; max-width: 520px; }
.skel i { display: block; height: 12px; border-radius: 6px; background: var(--sunken); animation: skel 1.4s ease-in-out infinite; }
.skel i:nth-child(2) { width: 86%; animation-delay: .15s; } .skel i:nth-child(3) { width: 62%; animation-delay: .3s; }
@keyframes skel { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

.verdict { display: flex; flex-direction: column; gap: 10px; }
.verdict h2 { font-size: 24px; line-height: 1.2; letter-spacing: -.025em; }
.verdict h2:focus { outline: none; }
.lvl-chip { align-self: flex-start; display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
.lvl-duplicate { background: var(--dup-soft); color: var(--dup); } .lvl-similar { background: var(--sim-soft); color: var(--sim); } .lvl-related { background: var(--rel-soft); color: var(--rel); } .lvl-new { background: var(--new-soft); color: var(--new); }
.lvl-chip .dot { background: currentColor; }
.prose { font-size: 16px; line-height: 1.65; color: var(--ink); max-width: 68ch; }
.prose + .prose { margin-top: -6px; }
.prose b { font-weight: 600; }
.w { display: inline-block; }
.cite { position: relative; display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; margin: 0 2px; padding: 0 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); font: 600 12px/1 var(--mono); vertical-align: 2px; transition: background-color .15s, color .15s, transform var(--dur-snappy) var(--spring-snappy); }
.cite:hover, .cite.is-lit { background: var(--accent); color: var(--on-accent); }
.cite:active { transform: scale(.96); }
.cite::after { content: ""; position: absolute; inset: -10px -4px; }
.meta-line { display: flex; flex-wrap: wrap; gap: 6px; }
.note { display: flex; gap: 10px; padding: 10px 14px; border-radius: var(--r-m); background: var(--sim-soft); color: var(--sim); font-size: 14px; }
.note.is-error { background: var(--dup-soft); color: var(--dup); }
.note .ic { margin-top: 2px; }
.note p + p { margin-top: 2px; }

.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.sec h3 { white-space: nowrap; }
.sec h3 { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.sec h3 .ic { width: 16px; height: 16px; }
.fine { font-size: 13px; color: var(--ink-3); }

.hits { display: flex; flex-direction: column; border-radius: var(--r-l); box-shadow: var(--shadow-1); overflow: hidden; }
.hit { position: relative; display: flex; align-items: stretch; background: var(--panel); transition: background-color .15s; }
.hit + .hit { box-shadow: inset 0 1px 0 var(--line); }
.hit:hover, .hit.is-lit { background: var(--bg); }
.hit.is-open { background: var(--accent-soft); }
.hit-main { flex: 1; min-width: 0; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 2px 12px; padding: 13px 4px 13px 14px; text-align: left; border-radius: 0; }
.hit-main:focus-visible { outline-offset: -2px; border-radius: var(--r-m); }
.hit-no { grid-row: 1 / span 3; align-self: start; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--sunken); font: 600 12px/1 var(--mono); color: var(--ink-2); margin-top: 1px; }
.hit-top { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; color: var(--ink-3); }
.hit-top .ic { width: 15px; height: 15px; }
.hit-top span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hit-top .mono, .hit-top [aria-hidden] { flex: none; }
.hit-title { grid-column: 2; font-weight: 600; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hit-text { grid-column: 2; font-size: 14px; line-height: 1.5; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.hit-score { grid-column: 3; grid-row: 1 / span 3; align-self: center; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; min-width: 84px; }
.hit-score b { font-size: 13px; font-weight: 500; color: var(--ink-3); }
.hit-out { flex: none; width: 44px; display: flex; align-items: center; justify-content: center; color: var(--ink-3); transition: color .15s; }
.hit-out:hover { color: var(--accent-ink); }
.hit-out:focus-visible { outline-offset: -4px; }
.more-btn { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 999px; color: var(--ink-2); font-size: 14px; font-weight: 500; transition: background-color .15s, transform var(--dur-snappy) var(--spring-snappy); }
.more-btn:hover { background: var(--sunken); }
.more-btn:active { transform: scale(.96); }
.more-btn .ic { width: 16px; height: 16px; transition: transform var(--dur-snappy) var(--spring-snappy); }
.more-btn[aria-expanded="true"] .ic { transform: rotate(180deg); }
.empty { padding: 18px; border-radius: var(--r-l); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-2); }

.bars { display: flex; flex-direction: column; gap: 12px; }

.bar-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--sunken); overflow: hidden; }
.bar span { display: block; height: 100%; border-radius: 3px; background: var(--accent-ink); transform: translateX(-101%); transition: transform var(--dur-soft) var(--spring-soft); }
.in .bar span { transform: translateX(calc(-100% + var(--v) * 1%)); }
.bar-row:nth-child(n+2) .bar span { background: var(--ink-3); }
.two { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 24px; }

.artifact { display: flex; align-items: stretch; border-radius: var(--r-l); background: var(--panel); box-shadow: var(--shadow-1); overflow: hidden; transition: box-shadow .2s; }

.artifact .btn { align-self: center; margin-right: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line-strong); font-size: 14px; font-weight: 600; white-space: nowrap; text-decoration: none; color: var(--ink); transition: background-color .15s, transform var(--dur-snappy) var(--spring-snappy); }
.btn:hover { background: var(--sunken); }

.todo { display: flex; flex-direction: column; gap: 6px; }
.todo li { display: flex; gap: 10px; font-size: 14px; color: var(--ink-2); }

.guide { display: flex; flex-direction: column; gap: 8px; }
.guide li { display: flex; align-items: baseline; gap: 10px; font-size: 14px; min-width: 0; }
.guide a { flex: none; }
.guide span { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- Detailbereich rechts ---------- */
.insp { min-width: 0; min-height: 0; display: flex; flex-direction: column; margin: 8px 8px 8px 0; border-radius: var(--r-xl); background: var(--panel); box-shadow: var(--shadow-1); overflow: hidden; view-transition-name: insp; }

.insp-head { display: flex; align-items: center; gap: 10px; height: 52px; flex: none; padding: 0 10px 0 20px; }
.insp-head .grow { flex: 1; }
.insp-head .lvl-chip { align-self: center; }
.insp-body { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 20px; }
.insp-body h2 { font-size: 20px; line-height: 1.25; letter-spacing: -.02em; }

.meter { display: flex; align-items: center; gap: 10px; }
.meter .bar { flex: 1; }
.meter .bar span { background: currentColor; }
.passage { padding: 12px 14px; border-radius: var(--r-m); background: var(--bg); font-size: 14px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
.passage + .passage { margin-top: 8px; }
.passage b { display: block; font-size: 13px; color: var(--ink-3); margin-bottom: 2px; }
.markup { padding: 14px 16px; border-radius: var(--r-m); background: var(--bg); font: 400 13px/1.6 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }

.scrim { display: none; position: fixed; inset: 0; z-index: 29; background: rgba(8, 12, 20, .36); cursor: default; view-transition-name: scrim; }
.how { font-size: 13px; color: var(--ink-3); }

.rich li { position: relative; padding-left: 16px; }
.rich li::before { content: ""; position: absolute; left: 3px; top: .7em; width: 5px; height: 5px; border-radius: 50%; background: var(--ink-3); }
.hist-group { padding: 10px 12px 4px; font-size: 13px; color: var(--ink-3); }

/* ---------- Seite Daten ---------- */
.data { padding: 4px 0 48px; display: flex; flex-direction: column; gap: 28px; }
.data-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; }
.data-head h2 { font-size: 30px; line-height: 1.1; letter-spacing: -.03em; }
.data-head p { color: var(--ink-2); max-width: 56ch; margin-top: 8px; }
.advice { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 36px; padding: 22px 24px; border-radius: var(--r-xl); background: var(--bg); }
.advice-val { display: flex; flex-direction: column; }

.advice h3 { font-size: 14px; color: var(--ink-2); grid-column: 1 / -1; }
.advice ul { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--ink-2); }
.advice .state { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--new); margin-bottom: 8px; }
.advice .state.warn { color: var(--sim); }
.src-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.card { display: flex; flex-direction: column; gap: 16px; padding: 20px; border-radius: var(--r-l); box-shadow: var(--shadow-1); min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.card h3 { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stats div { display: flex; flex-direction: column; }
.stats b { font-size: 24px; letter-spacing: -.03em; font-weight: 600; line-height: 1.15; }
.stats span { font-size: 13px; color: var(--ink-3); }
.strip { display: flex; flex-direction: column; gap: 4px; }
.strip-track { position: relative; height: 34px; }
.strip-track::before { content: ""; position: absolute; left: 0; right: 0; top: 20px; height: 6px; border-radius: 3px; background: var(--sunken); }
.strip-band, .strip-box { position: absolute; top: 20px; height: 6px; border-radius: 3px; }
.strip-band { background: var(--line-strong); }
.strip-box { background: var(--accent-ink); }
.strip-median { position: absolute; top: 16px; width: 3px; height: 14px; margin-left: -1.5px; border-radius: 2px; background: var(--ink); }
.strip-chunk { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1.5px dashed var(--dup); }
.strip-chunk i { position: absolute; top: -2px; right: 6px; font: 500 12px/1.2 var(--font); color: var(--dup); white-space: nowrap; }
.strip-axis { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-3); }
.groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.groups .bars { gap: 9px; }
.groups .bar-name { font-weight: 400; font-size: 14px; }
.groups .bar-val { font-weight: 500; font-size: 14px; }
.groups .bar { height: 4px; }
.groups .bar span, .groups .bar-row:nth-child(n+2) .bar span { background: var(--accent-ink); }
.sync { display: flex; flex-direction: column; gap: 10px; }
.sync li { display: flex; gap: 10px; align-items: baseline; font-size: 14px; }
.sync .dot.ok { background: var(--new); } .sync .dot.bad { background: var(--dup); }

.live { position: fixed; left: 50%; bottom: 24px; z-index: 40; transform: translateX(-50%); pointer-events: none; }
.toast { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 14px; font-weight: 500; box-shadow: var(--shadow-3); }

/* ---------- Morph-Übergänge (View Transitions) ---------- */
/* Momentaufnahmen werden nie gestreckt: sie behalten ihre Größe und werden vom wandernden Rahmen beschnitten. */
::view-transition { pointer-events: none; }
::view-transition-group(*) { animation-duration: 380ms; animation-timing-function: var(--spring-smooth); }
::view-transition-group(main), ::view-transition-group(side), ::view-transition-group(insp), ::view-transition-group(inspect), ::view-transition-group(composer) { overflow: clip; border-radius: 24px; }
::view-transition-group(inspect) { background: var(--panel); }
::view-transition-old(main), ::view-transition-new(main), ::view-transition-old(side), ::view-transition-new(side),
::view-transition-old(insp), ::view-transition-new(insp), ::view-transition-old(inspect), ::view-transition-new(inspect) { width: 100%; height: 100%; object-fit: none; object-position: left top; }
::view-transition-old(composer), ::view-transition-new(composer) { width: 100%; height: 100%; object-fit: none; object-position: left bottom; }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: 160ms; }
::view-transition-old(main), ::view-transition-old(composer), ::view-transition-old(inspect) { animation-duration: 150ms; }
::view-transition-old(insp), ::view-transition-new(insp) { animation-duration: 180ms; }
::view-transition-new(insp):only-child { animation: insp-in 380ms var(--spring-smooth) both; }
::view-transition-old(insp):only-child { animation: insp-out 160ms ease-in both; }
@keyframes insp-in { from { opacity: 0; transform: translateX(24px); filter: blur(4px); } }
@keyframes insp-out { to { opacity: 0; transform: translateX(16px); filter: blur(4px); } }
:root[data-vt="side"]::view-transition-group(*), :root[data-vt="close"]::view-transition-group(*) { animation-duration: var(--dur-snappy); animation-timing-function: var(--spring-snappy); }
:root[data-vt="theme"] :is(.side, .main, .composer, .insp, .scrim) { view-transition-name: none; }
:root[data-vt="theme"]::view-transition-old(root), :root[data-vt="theme"]::view-transition-new(root) { animation-duration: 200ms; }

.side-looks { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 4px 0 12px; font-size: 13px; color: var(--ink-3); }
.app[data-side="closed"] .side-looks { display: none; }

/* ================= Gestaltungsvarianten zum Vergleichen (A ist der Stand oben) ================= */

/* ---------- B „Fokus“: eine ruhige Fläche, Frage als Überschrift, Quellen als Kacheln, Details als Fenster ---------- */
:root[data-look="b"] { --bg: #f7f8fa; --col: 820px; }

:root[data-look="b"] .hit-text, :root[data-look="b"] .hit-out { display: none; }

:root[data-look="b"] .verdict h2 { font-size: 20px; }
:root[data-look="b"] .composer { border-radius: 28px; }
:root[data-look="b"] .insp { position: fixed; z-index: 30; left: 50%; top: 50%; right: auto; bottom: auto; width: min(760px, calc(100vw - 48px)); height: auto; max-height: min(720px, calc(100dvh - 64px)); margin: 0; transform: translate(-50%, -50%); border-radius: 28px; box-shadow: var(--shadow-3); }
:root[data-look="b"] .app[data-insp="1"] .scrim { display: block; }
:root[data-look="b"] .insp-head { height: 60px; padding: 0 14px 0 28px; }
:root[data-look="b"] .insp-body { padding: 4px 28px 24px; }

/* ---------- C „Arbeitsplatz“: dicht, bündig, Suche oben, Details als geteilte Ansicht ---------- */
:root[data-look="c"] { --r-s: 6px; --r-m: 8px; --r-l: 10px; --r-xl: 12px; --col: 1040px; --insp-w: 480px; --side-w: 248px; }

:root[data-look="c"] .lvl-chip { height: 22px; border-radius: 6px; }

:root[data-look="c"] .insp-body h2 { font-size: 17px; }
:root[data-look="c"] .hero h1 { font-size: 30px; }

/* ---------- D „Marke“: blaue Leiste, Kopfzeile, Karten mit Kontur ---------- */
:root[data-look="d"] { --bg: #eef1f6; --r-l: 16px; --r-xl: 16px; --side-w: 264px; --shadow-1: 0 0 0 1px rgba(13, 19, 30, .1); }
