<style>
/* Schlanke Fassung: ruhige, kühle Flächen, Markenblau für Bedienung, Farbe nur für die Einstufung der Treffer
   (Duplikat rot, sehr ähnlich bernstein, verwandt schieferblau). Maße und Farben stehen gebündelt in :root. */
:root {
  --font: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --bg: #edf1f8; --surface: #ffffff; --sunken: #f4f6fb; --ink: #0f1a30; --muted: #525e78; --line: #dbe2ee;
  --brand: #0050aa; --brand-strong: #003e96; --on-brand: #ffffff; --brand-soft: #e2ecfb; --yellow: #ffcf00; --flag-red: #e30613;
  --dup: #b3201c; --dup-soft: #fde7e5; --sim: #8a5200; --sim-soft: #fcefd2; --rel: #37557d; --rel-soft: #e5ecf6; --new: #1b6e44; --new-soft: #e1f3e8;
  --shadow: 0 1px 2px rgba(15, 26, 48, .06), 0 8px 24px rgba(15, 26, 48, .07);
  --shadow-lift: 0 2px 4px rgba(15, 26, 48, .08), 0 18px 44px rgba(0, 62, 150, .14);
  --r-lg: 20px; --r-md: 14px; --r-sm: 9px; --rail: 252px; --gap: 16px;
}
:root[data-theme="dark"] {
  --bg: #0a111f; --surface: #121b2d; --sunken: #0e1626; --ink: #e9eef9; --muted: #a0adc6; --line: #25314a;
  --brand: #8dbbff; --brand-strong: #1f66d1; --on-brand: #ffffff; --brand-soft: #172a4b;
  --dup: #ff9a92; --dup-soft: #3a1a1d; --sim: #f2c063; --sim-soft: #37290f; --rel: #adc5ea; --rel-soft: #1b2740; --new: #7fd6a3; --new-soft: #12301f;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .28);
  --shadow-lift: 0 2px 4px rgba(0, 0, 0, .4), 0 18px 44px rgba(0, 0, 0, .4);
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); }
h1, h2, h3, p, ul, ol, dl, dd, fieldset, pre { margin: 0; padding: 0; }
ul, ol { list-style: none; }
fieldset { border: 0; min-width: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--brand); text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 10; padding: 10px 14px; border-radius: var(--r-sm); background: var(--brand-strong); color: var(--on-brand); }
.skip:focus { top: 12px; }
.boot, .waiting { display: flex; align-items: center; gap: 10px; padding: 28px; color: var(--muted); }
.spinner { width: 16px; height: 16px; flex: none; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--brand); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Rahmen ---------- */
.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: 12px; align-self: start; height: calc(100vh - 24px); margin: 12px 0 12px 12px; padding: 16px 12px; display: flex; flex-direction: column; gap: 18px;
  background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px; font-weight: 750; font-size: 17px; letter-spacing: -.01em; }
.brand img { display: block; }
.nav { display: grid; gap: 4px; }
.nav-link { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--r-sm); color: var(--muted); text-decoration: none; font-weight: 600; }
.nav-link:hover { background: var(--sunken); color: var(--ink); }
.nav-link[aria-current="page"] { background: var(--brand-soft); color: var(--brand); }
.recent { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.recent h2 { padding: 0 8px; font-size: 13px; font-weight: 650; color: var(--muted); }
.recent-list { overflow: auto; display: grid; gap: 2px; }
.recent-item { display: flex; align-items: flex-start; gap: 8px; width: 100%; padding: 7px 8px; border: 0; border-radius: var(--r-sm); background: none; text-align: left; cursor: pointer; }
.recent-item:hover { background: var(--sunken); }
.recent-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13px; line-height: 1.35; }
.recent-empty { padding: 0 8px; font-size: 13px; color: var(--muted); }
.dot { width: 8px; height: 8px; margin-top: 5px; flex: none; border-radius: 50%; background: var(--new); }
.dot.lvl-duplicate, .dot.bad { background: var(--dup); } .dot.lvl-similar { background: var(--sim); } .dot.ok { background: var(--new); }
.rail-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.lang { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--sunken); }
.lang button { min-width: 44px; min-height: 36px; padding: 5px 10px; border: 0; border-radius: 999px; background: none; font-size: 13px; font-weight: 650; color: var(--muted); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.icon-btn { display: grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--sunken); color: var(--muted); cursor: pointer; }
.icon-btn:hover { color: var(--ink); }
.main { min-width: 0; padding: 28px 32px 48px; }
.main:focus { outline: none; }
.page { max-width: 1360px; margin: 0 auto; }

/* ---------- Kopf und Eingabe ---------- */
.page-head h1 { font-size: 26px; line-height: 1.15; font-weight: 750; letter-spacing: -.02em; }
.page-head .lede { margin-top: 6px; max-width: 68ch; color: var(--muted); }
.page-head.row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.is-start { max-width: 800px; padding-top: min(12vh, 110px); }
.is-start .page-head h1 { font-size: clamp(34px, 4.4vw, 52px); }
.is-start .page-head .lede { font-size: 17px; }
.has-result .page-head .lede { display: none; }
.composer { position: relative; margin-top: 18px; padding: 16px; border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow-lift); overflow: hidden; }
/* Dreifarbstreifen der Marke: drei feste Farbflächen */
.composer::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px;
  background: linear-gradient(90deg, var(--brand-strong) 0 62%, var(--yellow) 62% 86%, var(--flag-red) 86% 100%); }
.seg { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--sunken); }
.seg-item { position: relative; cursor: pointer; }
.seg-item input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.seg-item span { display: block; padding: 7px 16px; border-radius: 999px; font-weight: 650; color: var(--muted); }
.seg-item input:checked + span { background: var(--brand-strong); color: var(--on-brand); }
.seg-item input:focus-visible + span { outline: 3px solid var(--brand); outline-offset: 2px; }
.mode-hint { margin: 8px 4px 10px; font-size: 14px; color: var(--muted); }
.composer textarea { display: block; width: 100%; min-height: 76px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: var(--r-md); background: var(--sunken); resize: vertical; font-size: 16px; line-height: 1.5; }
.composer textarea::placeholder { color: var(--muted); }
.composer textarea:focus { outline: 2px solid var(--brand); outline-offset: 1px; border-color: var(--brand); background: var(--surface); }
.composer-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-right: auto; }
.chip { position: relative; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 6px 12px; border: 1.5px solid var(--line); border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; }
.chip input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chip:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
.chip:has(input:focus-visible) { outline: 3px solid var(--brand); outline-offset: 2px; }
.country { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--muted); }
.country select { padding: 7px 10px; border: 1.5px solid var(--line); border-radius: var(--r-sm); background: var(--surface); color: var(--ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 18px; border: 0; border-radius: 999px; background: var(--brand-strong); color: var(--on-brand); font-weight: 700; cursor: pointer; }
.btn:hover { filter: brightness(1.1); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .75; cursor: progress; }
.btn .spinner { border-color: rgba(255, 255, 255, .4); border-top-color: #fff; }
.btn-quiet { min-height: 36px; padding: 6px 14px; background: var(--brand-soft); color: var(--brand); }
.btn-quiet .spinner { border-color: var(--line); border-top-color: var(--brand); }
.examples { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 18px; font-size: 14px; color: var(--muted); }
.chip-btn { min-height: 36px; padding: 6px 12px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 14px; font-weight: 600; cursor: pointer; }
.chip-btn:hover { border-color: var(--brand); color: var(--brand); }

/* ---------- Ergebnis ---------- */
#result { margin-top: 22px; }
.banner { display: flex; gap: 10px; margin-bottom: var(--gap); padding: 12px 14px; border-radius: var(--r-md); background: var(--sim-soft); color: var(--sim); font-size: 14px; }
.banner.is-error { background: var(--dup-soft); color: var(--dup); }
.banner .ic { margin-top: 2px; }
.grid, .data-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 430px); gap: var(--gap); align-items: start; }
.hits h2, .card h2 { font-size: 16px; font-weight: 700; letter-spacing: -.005em; }
.hits > h2 { margin: 4px 4px 10px; }
.hit-list { display: grid; gap: 10px; }
.hit { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; padding: 14px 16px; border-radius: var(--r-md); background: var(--surface); box-shadow: var(--shadow); border-left: 4px solid var(--rel); }
.hit.lvl-duplicate { border-left-color: var(--dup); } .hit.lvl-similar { border-left-color: var(--sim); }
.ring { position: relative; width: 46px; height: 46px; color: var(--rel); }
.ring.lvl-duplicate { color: var(--dup); } .ring.lvl-similar { color: var(--sim); }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 4; }
.ring-track { stroke: var(--line); } .ring-value { stroke: currentColor; stroke-linecap: round; }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 14px; font-weight: 750; color: var(--ink); }
.hit-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; }
.pill { padding: 2px 9px; border-radius: 999px; font-weight: 700; background: var(--rel-soft); color: var(--rel); }
.pill.lvl-duplicate { background: var(--dup-soft); color: var(--dup); } .pill.lvl-similar { background: var(--sim-soft); color: var(--sim); }
.src { display: inline-flex; align-items: center; gap: 4px; font-weight: 650; color: var(--muted); }
.src .ic { width: 15px; height: 15px; }
.tag { padding: 2px 8px; border-radius: 6px; background: var(--sunken); color: var(--muted); font-size: 12.5px; font-weight: 600; }
.tag-stream { background: var(--brand-soft); color: var(--brand); }
.hit h3 { margin-top: 6px; font-size: 16px; line-height: 1.3; font-weight: 700; }
.hit-title { color: var(--ink); text-decoration: none; }
a.hit-title:hover { color: var(--brand); text-decoration: underline; }
.hit-title .ic { width: 14px; height: 14px; margin-left: 5px; vertical-align: -1px; color: var(--muted); }
.passage { margin-top: 6px; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.path { margin-right: 6px; padding: 1px 7px; border-radius: 6px; background: var(--sunken); color: var(--ink); font-size: 12.5px; font-weight: 650; }
.hit-foot { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
.via { display: inline-flex; align-items: center; gap: 4px; }
.via .ic { width: 14px; height: 14px; }
.side, .data-main { display: grid; gap: var(--gap); min-width: 0; }
.card { padding: 16px 18px; border-radius: var(--r-md); background: var(--surface); box-shadow: var(--shadow); min-width: 0; }
.card h3 { margin: 14px 0 6px; font-size: 14px; font-weight: 700; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.card-head h2 { display: inline-flex; align-items: center; gap: 8px; }
.fine { margin-top: 6px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.fine-label { font-weight: 650; color: var(--ink); }
.verdict { border-top: 4px solid var(--new); background: var(--surface); }
.verdict.lvl-duplicate { border-top-color: var(--dup); } .verdict.lvl-similar { border-top-color: var(--sim); }
.verdict h2 { font-size: 20px; line-height: 1.2; letter-spacing: -.015em; }
.verdict h2:focus { outline: none; }
.verdict-hint { margin-top: 6px; color: var(--muted); font-size: 14px; }
.verdict-top { margin-top: 4px; font-weight: 700; overflow-wrap: anywhere; }
.meter { margin: 16px 0 6px; }
.meter-track { position: relative; height: 10px; border-radius: 999px; background: var(--new-soft); }
.meter-zone { position: absolute; top: 0; bottom: 0; }
.z-similar { background: var(--sim-soft); } .z-duplicate { background: var(--dup-soft); border-radius: 0 999px 999px 0; }
.meter-pin { position: absolute; top: -5px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; border: 4px solid var(--surface); background: var(--new); box-shadow: var(--shadow); }
.meter-pin.lvl-duplicate { background: var(--dup); } .meter-pin.lvl-similar { background: var(--sim); }
.meter-labels { position: relative; height: 20px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.meter-labels span { position: absolute; top: 0; white-space: nowrap; }
.bars { display: grid; gap: 12px; margin-top: 12px; }
.bars.compact { gap: 8px; }
.bar-head { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.bar-name { font-weight: 650; overflow-wrap: anywhere; } .bar-val { font-weight: 700; font-variant-numeric: tabular-nums; }
.bar { height: 8px; margin-top: 4px; border-radius: 999px; background: var(--sunken); overflow: hidden; }
.bar span { display: block; height: 100%; border-radius: 999px; background: var(--rel); }
.is-top .bar span { background: var(--brand-strong); }
:root[data-theme="dark"] .is-top .bar span { background: var(--brand); }
.epics { margin-top: 12px; font-size: 13px; }
.markup { margin-top: 10px; max-height: 420px; overflow: auto; padding: 12px 14px; border-radius: var(--r-sm); background: var(--sunken); border: 1px solid var(--line);
  font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
.plain { display: grid; gap: 6px; margin-top: 8px; font-size: 14px; }
.plain li { position: relative; padding-left: 16px; }
.plain li::before { content: ""; position: absolute; left: 2px; top: 9px; width: 6px; height: 6px; border-radius: 50%; background: var(--brand); }
.guide { display: grid; gap: 10px; margin-top: 10px; }
.guide-link { font-weight: 650; overflow-wrap: anywhere; }
.empty { padding: 36px 24px; border-radius: var(--r-md); background: var(--surface); box-shadow: var(--shadow); text-align: center; color: var(--muted); }
.empty-title { margin-bottom: 6px; font-size: 18px; font-weight: 700; color: var(--ink); }
.empty p { max-width: 56ch; margin-left: auto; margin-right: auto; }
.skel-list { display: grid; gap: 10px; max-width: 900px; }
.skel-list span { height: 92px; border-radius: var(--r-md); background: var(--surface); box-shadow: var(--shadow); animation: pulse 1.2s ease-in-out infinite alternate; }
@keyframes pulse { from { opacity: 1; } to { opacity: .55; } }

/* ---------- Daten ---------- */
.store { margin: -8px 0 14px; }
.advice { border-top: 4px solid var(--brand-strong); }
.advice-value { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; margin-top: 8px; font-size: 17px; }
.advice-value b { font-size: 40px; line-height: 1; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.advice-plus { margin-left: 10px; padding: 3px 10px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); font-size: 14px; font-weight: 650; }
.advice-state { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-weight: 650; }
.advice-state .ic { color: var(--new); }
.advice .plain { margin-top: 12px; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.tile { padding: 10px 12px; border-radius: var(--r-sm); background: var(--sunken); }
.tile b { display: block; font-size: 24px; line-height: 1.15; font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.tile span { font-size: 13px; color: var(--muted); }
.strip { margin-top: 26px; }
.strip-track { position: relative; height: 26px; border-radius: 8px; background: var(--sunken); }
.strip-band { position: absolute; top: 9px; height: 8px; border-radius: 4px; background: var(--rel-soft); border: 1px solid var(--rel); }
.strip-box { position: absolute; top: 4px; height: 18px; border-radius: 5px; background: var(--rel); }
.strip-median { position: absolute; top: 1px; width: 3px; height: 24px; margin-left: -1px; border-radius: 2px; background: var(--ink); }
.strip-chunk { position: absolute; top: -6px; bottom: -6px; width: 0; border-left: 2px dashed var(--flag-red); }
.strip-chunk i { position: absolute; bottom: 100%; left: 0; transform: translateX(-50%); padding-bottom: 2px; font-style: normal; font-size: 12px; font-weight: 700; color: var(--dup); white-space: nowrap; }
.strip-axis { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.kvs { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 2px 20px; margin-top: 12px; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { font-weight: 700; font-variant-numeric: tabular-nums; }
.sync { display: grid; gap: 10px; margin-top: 10px; }
.sync li { display: flex; gap: 8px; }

@media (max-width: 1100px) { .grid, .data-grid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; margin: 10px 10px 0; padding: 10px 12px; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px; }
  .nav { display: flex; margin-right: auto; }
  .recent { display: none; }
  .main { padding: 18px 14px 40px; }
  .is-start { padding-top: 18px; }
  .page-head.row { flex-direction: column; }
  .hit { grid-template-columns: minmax(0, 1fr); }
  .tiles { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { .spinner, .skel-list span { animation: none; } .btn:active { transform: none; } }
</style>
