<script>
  // Erste Anfrage sofort starten, noch bevor die großen Skripte unten gelesen sind. JsApp nimmt das Ergebnis aus BOOT.
  // Kennt der Browser die Seite schon (Seiten-Cache in JsApp), geht ihre Kennung mit; unverändert kommt nur {same}.
  (function () {
    var full = window.START_PATH && window.START_PATH.charAt(0) === '/' ? window.START_PATH : '';
    if (!full) { try { full = decodeURI(location.hash.replace(/^#/, '')); } catch (err) { full = ''; } }
    if (full.charAt(0) !== '/') full = '/';
    if (!(window.google && google.script && google.script.run)) return;
    var i = full.indexOf('?'), path = i < 0 ? full : full.slice(0, i), params = {};
    new URLSearchParams(i < 0 ? '' : full.slice(i + 1)).forEach(function (v, k) { if (k.charAt(0) !== '_') (params[k] = params[k] || []).push(v); });
    try {
      var index = window.VIEWER && localStorage.getItem('pc-user') === window.VIEWER ? JSON.parse(localStorage.getItem('pc-index') || '[]') : [];
      for (var n = 0; n < index.length; n++) if (index[n].k === full && index[n].etag) params._etag = [index[n].etag];
    } catch (err) { /* ohne Speicher: ganze Seite */ }
    if (window.PERF_ON) params._perf = ['1'];
    window.BOOT = { full: full, promise: new Promise(function (resolve, reject) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).apiRequest('GET', path || '/', params);
    }) };
    window.BOOT.promise.catch(function () { /* Fehler zeigt JsApp, sobald es die Antwort abholt */ });
  })();
</script>
